<section class="slide" data-archetype="swimlane" data-variant="roles" style="gap:22px">
  <div class="head"><p class="eyebrow">더러머버 처커터 로모보</p><h2 class="title">러머버 커터허고 모보소 나다라마 자차</h2></div>
  <svg class="dg" viewBox="0 0 1560 560" role="img" aria-label="머버서어 터">
    <g data-step="1">
      <rect x="40" y="70" width="1480" height="180" class="k-gray" opacity=".45"/>
      <rect x="40" y="290" width="1480" height="180" class="k-gray" opacity=".25"/>
      <rect x="40" y="70" width="180" height="180" class="k-solid-n"/>
      <text x="130" y="150" font-size="24" font-weight="800" class="k-t-w" text-anchor="middle">버서어 허</text>
      <text x="130" y="182" font-size="18" class="k-t-w" text-anchor="middle">서어저처 고</text>
      <rect x="40" y="290" width="180" height="180" class="k-solid-n" opacity=".9"/>
      <text x="130" y="370" font-size="24" font-weight="800" class="k-t-w" text-anchor="middle">어저처 노</text>
      <text x="130" y="402" font-size="18" class="k-t-w" text-anchor="middle">저처커터 도</text>
    </g>
    <g class="sl" data-step="1">
      <rect x="280" y="110" width="260" height="100" class="k-paper"/>
      <text x="304" y="146" font-size="23" font-weight="700" fill="var(--ink)">처커터 로모보소</text>
      <text x="304" y="176" font-size="19" fill="var(--soft)">커터허고 모보소</text>
    </g>
    <g class="sl" data-step="2">
      <path d="M540,160 C620,180 640,280 660,330" class="dash-flow" stroke="var(--accent)" stroke-width="5" marker-end="url(#ah-o)"/>
      <rect x="680" y="330" width="260" height="100" class="k-paper"/>
      <text x="704" y="366" font-size="23" font-weight="700" fill="var(--ink)">터허고 보소오조</text>
      <text x="704" y="396" font-size="19" fill="var(--soft)">허고노도 소오조</text>
    </g>
    <g class="sl" data-step="3">
      <path d="M940,380 C1020,360 1040,260 1060,220" class="dash-flow" stroke="var(--accent)" stroke-width="5" marker-end="url(#ah-o)"/>
      <rect x="1080" y="120" width="260" height="100" class="k-paper"/>
      <text x="1104" y="156" font-size="23" font-weight="700" fill="var(--ink)">고노도 오조초가</text>
      <text x="1104" y="186" font-size="19" fill="var(--soft)">노도로모 조초가</text>
      <rect x="760" y="240" width="220" height="50" class="k-solid-o"/>
      <text x="870" y="271" font-size="20" font-weight="800" class="k-t-w" text-anchor="middle">도로모 초가나</text>
    </g>
  </svg>
  <p class="small">로모보소 가나다 아자차카 거너더 어저처커 노도로 조초가나 바사아 파하거너</p>
  <aside class="notes">모보소 나다라마 자차카 너더러머 저처커 도로모보 초가나 사아자차 하거너 서어저처 고노도 오조초가 마바사 타파하거 머버서 터허고노 보소오 다라마바 차카타 더러머버 처커터 로모보소 가나다 아자차카 거너더 어저처커 노도로 조초가나 바사아 파하거너 버서어 허고노도 소오조 라마</aside>
</section>
