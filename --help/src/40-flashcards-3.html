<section class="slide" data-archetype="flashcards" data-variant="qa" style="gap:32px">
  <div class="head"><p class="eyebrow">초가나다 사아자 하거너</p><h2 class="title">가나다 아자차카 거너더 어저처커 노도</h2></div>
  <div class="fcards" style="grid-template-columns:repeat(3,1fr)">
    <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><span class="fc-no">Q1</span><span style="font-size:34px;font-weight:700;text-align:center">나다라마 자차카 너더러<br>다라마 차카타파 더</span></span><span class="fc-back"><span class="fc-no">A1</span><span class="body" style="font-size:26px;color:var(--ink)">라마바사 카타파 러머버서 커터허 모보소오 나다라 자차카타 너더러</span></span></span></button>
    <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><span class="fc-no">Q2</span><span style="font-size:34px;font-weight:700;text-align:center">마바사 타파하거 머버서<br>바사아자 파하거 버</span></span><span class="fc-back"><span class="fc-no">A2</span><span class="body" style="font-size:26px;color:var(--ink)">사아자 하거너더 서어저 고노도로 오조초 마바사아 타파하 머버서어</span></span></span></button>

  <aside class="notes">카타파 러머버서 커터허 모보소오 나다라 자차카타 너더러 저처커터 도로모 초가나다 사아자 하거너더 서어저 고노도로 오조초 마바사아 타파하 머버서어 터허고 보소오조 다라마 차카타파 더러머 처커터허 로모보 가나다라 아자차 거너더러 어저처 노도로모 조초가 바사아자 파하거 버서</aside>
