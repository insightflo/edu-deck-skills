<section class="slide" data-archetype="map" data-variant="regions" style="gap:24px">
<div class="head"><p class="eyebrow">라마바 카타파하 러머버</p><h2 class="title">마바사아 타파하 머버서어 터허고 보소</h2></div>
<div class="row" style="flex:1;min-height:0;gap:32px;align-items:stretch">

  <g data-step="1">

  <div class="card" data-step="1" style="padding:20px 24px;border-left:4px solid var(--accent)"><p class="label">거너더러 어</p><p class="body" style="font-size:24px">너더러 저처커터 도로모 초가나다</p></div>

<aside class="notes">저처커터 도로모 초가나다 사아자 하거너더 서어저 고노도로 오조초 마바사아 타파하 머버서어 터허고 보소오조 다라마 차카타파 더러머 처커터허 로모보 가나다라 아자차 거너더러 어저처 노도로모 조초가 바사아자 파하거 버서어저 허고노 소오조초 라마바 카타파하 러머버 커터허고 모</aside>
</section>
