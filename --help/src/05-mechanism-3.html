<section class="slide" data-archetype="mechanism" data-variant="parallel" style="gap:32px">

  <text class="t-l b" x="80" y="80">도로모 초가나다</text>
  <text class="t-l o" x="80" y="360">로모보소 가나다</text>
  <g data-step="1">
    <rect x="240" y="40" width="280" height="100" rx="18" fill="var(--paper)" stroke="var(--blue)" stroke-width="2"/>

    <path class="dash-flow" d="M540 90H650" marker-end="url(#ahb)" stroke="var(--blue)" stroke-width="3"/>
    <rect x="670" y="40" width="280" height="100" rx="18" fill="var(--paper)" stroke="var(--blue)" stroke-width="2"/>

<aside class="notes">아자차카 거너더 어저처커 노도로 조초가나 바사아 파하거너 버서어 허고노도 소오조 라마바사 카타파 러머버서 커터허 모보소오 나다라 자차카타 너더러 저처커터 도로모 초가나다 사아자 하거너더 서어저 고노도로 오조초 마바사아 타파하 머버서어 터허고 보소오조 다라마 차카타파 더</aside>
