<section class="slide" data-archetype="kanban-board" data-variant="stages" style="gap:22px">
  <div class="head"><p class="eyebrow">거너더러 어저처 노도로</p><h2 class="title">너더러 저처커터 도로모 초가나다 사아</h2></div>
  <svg class="dg" viewBox="0 0 1560 560" role="img" aria-label="더러머버 처">
    <rect x="40" y="50" width="340" height="480" class="k-gray"/>
    <rect x="410" y="50" width="340" height="480" class="k-gray"/>
    <rect x="780" y="50" width="340" height="480" class="k-gray"/>
    <rect x="1150" y="50" width="370" height="480" class="k-gray"/>
    <g data-step="1">
      <rect x="60" y="72" width="150" height="44" class="k-solid-n"/>
      <text x="135" y="101" font-size="22" font-weight="800" class="k-t-w" text-anchor="middle">러머버 커</text>
    </g>
    <g class="kb" data-step="1">
      <rect x="64" y="140" width="292" height="80" class="k-paper"/>
      <text x="84" y="174" font-size="23" font-weight="700" fill="var(--ink)">머버서어 터허고</text>
      <text x="84" y="202" font-size="20" fill="var(--soft)">버서어 허고</text>
    </g>
    <g class="kb" data-step="1">
      <rect x="64" y="236" width="292" height="80" class="k-paper"/>
      <text x="84" y="270" font-size="23" font-weight="700" fill="var(--ink)">서어저처 고노도</text>
      <text x="84" y="298" font-size="20" fill="var(--soft)">어저처 노도</text>
    </g>
    <g data-step="2">
      <rect x="430" y="72" width="150" height="44" class="k-solid-b" opacity=".75"/>
      <text x="505" y="101" font-size="22" font-weight="800" class="k-t-w" text-anchor="middle">저처커터</text>
    </g>
    <g class="kb" data-step="2">
      <rect x="434" y="140" width="292" height="80" class="k-paper"/>
      <text x="454" y="174" font-size="23" font-weight="700" fill="var(--ink)">처커터 로모보소</text>
      <text x="454" y="202" font-size="20" fill="var(--soft)">커터허고 모</text>
    </g>
    <g data-step="3">
      <rect x="800" y="72" width="150" height="44" class="k-solid-b"/>
      <text x="875" y="101" font-size="22" font-weight="800" class="k-t-w" text-anchor="middle">터허고 보</text>
    </g>
    <g class="kb" data-step="3">
      <path d="M726,180 C770,180 780,180 796,180" class="dash-flow" stroke="var(--line)" stroke-width="3" marker-end="url(#ah-b)"/>
      <rect x="804" y="140" width="292" height="80" class="k-orange"/>
      <text x="824" y="174" font-size="23" font-weight="700" fill="var(--ink)">허고노도 소오조</text>
      <text x="824" y="202" font-size="20" fill="var(--soft)">고노도 오조</text>
    </g>
    <g data-step="4">
      <rect x="1170" y="72" width="150" height="44" class="k-solid-o"/>
      <text x="1245" y="101" font-size="22" font-weight="800" class="k-t-w" text-anchor="middle">노도로모</text>
    </g>
    <g class="kb" data-step="4">
      <rect x="1174" y="140" width="292" height="80" class="k-paper"/>
      <text x="1194" y="174" font-size="23" font-weight="700" fill="var(--ink)">도로모 초가나다</text>
      <text x="1194" y="202" font-size="20" fill="var(--soft)">로모보소 가</text>
    </g>
  </svg>
  <p class="small">모보소 나다라마 자차카 너더러머 저처커 도로모보 초가나 사아자차 하거너</p>
  <aside class="notes">보소오조 다라마 차카타파 더러머 처커터허 로모보 가나다라 아자차 거너더러 어저처 노도로모 조초가 바사아자 파하거 버서어저 허고노 소오조초 라마바 카타파하 러머버 커터허고 모보소 나다라마 자차카 너더러머 저처커 도로모보 초가나 사아자차 하거너 서어저처 고노도 오조초가 마</aside>
</section>
