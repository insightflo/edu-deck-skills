    <h2 class="big" style="font-size:56px">조초가 바사아자 파하거 버서어<br>초가나다 사아자 하거너 <em class="t2" data-fx="weight-wave">가나다 아</em></h2>

  </div>
  <aside class="notes">라마바사 카타파 러머버서 커터허 모보소오 나다라 자차카타 너더러 저처커터 도로모 초가나다 사아자 하거너더 서어저 고노도로 오조초 마바사아 타파하 머버서어 터허고 보소오조 다라마 차카타파 더러머 처커터허 로모보 가나다라 아자차 거너더러 어저처 노도로모 조초가 바사아자 파</aside>
