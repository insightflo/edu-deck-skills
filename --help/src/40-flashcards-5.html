<section class="slide" data-archetype="flashcards" data-variant="category" style="gap:28px">
  <div class="head"><p class="eyebrow">저처커 도로모보 초가나</p><h2 class="title">처커터허 로모보 가나다라 아자차 거너</h2></div>
  <div class="row" style="flex:1;min-height:0;gap:32px">
    <div class="col" data-step="1" style="flex:1;min-height:0;gap:14px">
      <p class="eyebrow" style="color:var(--accent-text)">커터허 모보소</p>
      <div class="fcards" style="grid-template-rows:1fr 1fr">
        <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><span class="fc-no">1</span><span style="font-size:38px;font-weight:700">터허고노 보소</span></span><span class="fc-back"><span class="fc-no">1</span><span class="body" style="font-size:24px;color:var(--ink)">허고노 소오조초 라마바 카타파하 러머버 커터허고 모</span></span></span></button>
        <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><span class="fc-no">2</span><span style="font-size:38px;font-weight:700">고노도로 오조</span></span><span class="fc-back"><span class="fc-no">2</span><span class="body" style="font-size:24px;color:var(--ink)">노도로 조초가나 바사아 파하거너 버서어 허고노도 소</span></span></span></button>
      </div>
    </div>
    <div class="col" data-step="2" style="flex:1;min-height:0;gap:14px">
      <p class="eyebrow" style="color:var(--accent-text)">도로모보 초가</p>
      <div class="fcards" style="grid-template-rows:1fr 1fr">
        <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><span class="fc-no">3</span><span style="font-size:38px;font-weight:700">로모보 가나다</span></span><span class="fc-back"><span class="fc-no">3</span><span class="body" style="font-size:24px;color:var(--ink)">모보소오 나다라 자차카타 너더러 저처커터 도로모 초</span></span></span></button>
        <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><span class="fc-no">4</span><span style="font-size:38px;font-weight:700">보소오 다라마</span></span><span class="fc-back"><span class="fc-no">4</span><span class="body" style="font-size:24px;color:var(--ink)">소오조초 라마바 카타파하 러머버 커터허고 모보소 나</span></span></span></button>
      </div>
    </div>
  </div>
  <aside class="notes">오조초 마바사아 타파하 머버서어 터허고 보소오조 다라마 차카타파 더러머 처커터허 로모보 가나다라 아자차 거너더러 어저처 노도로모 조초가 바사아자 파하거 버서어저 허고노 소오조초 라마바 카타파하 러머버 커터허고 모보소 나다라마 자차카 너더러머 저처커 도로모보 초가나 사아</aside>
</section>
