<section class="slide dark" data-archetype="rules-dark" data-variant="flow" style="gap:48px">
  <div class="head"><p class="eyebrow">너더러머 저처커</p><h2 class="title">더러머 처커터허 로모보 가나다라</h2></div>
  <div class="col" style="flex:1;min-height:0;justify-content:center;gap:32px">
    <div data-step="1" style="display:flex;align-items:center;gap:28px">
      <p class="num" style="font-size:72px;margin:0">1</p>
      <div class="col" style="gap:10px">
        <h3 style="font-size:40px;margin:0">러머버서 커터허 모보소</h3>
        <div class="vflow" style="gap:8px"><span class="vnode is-off">머버서 터</span><span class="varr">→</span><span class="vnode">버서어저 허</span><span class="varr">→</span><span class="vnode is-on">서어저 고노</span></div>
      </div>
    </div>
    <div data-step="2" style="display:flex;align-items:center;gap:28px">
      <p class="num" style="font-size:72px;margin:0">2</p>
      <div class="col" style="gap:10px">
        <h3 style="font-size:40px;margin:0">어저처커 노도로 조초</h3>
        <div class="vflow" style="gap:8px"><span class="vnode is-off">저처커 도</span><span class="varr">→</span><span class="vnode">처커터허</span><span class="varr">→</span><span class="vnode is-on">커터허 모보소</span></div>
      </div>
    </div>
    <div data-step="3" style="display:flex;align-items:center;gap:28px">
      <p class="num" style="font-size:72px;margin:0">3</p>
      <div class="col" style="gap:10px">
        <h3 style="font-size:40px;margin:0">터허고노 보소오 다라마</h3>
        <div class="vflow" style="gap:8px"><span class="vnode is-off">허고노 소오</span><span class="varr">→</span><span class="vnode">고노도로 오</span><span class="varr">→</span><span class="vnode is-on">노도로 조</span></div>
      </div>
    </div>
  </div>
  <aside class="notes">도로모보 초가나 사아자차 하거너 서어저처 고노도 오조초가 마바사 타파하거 머버서 터허고노 보소오 다라마바 차카타 더러머버 처커터 로모보소 가나다 아자차카 거너더 어저처커 노도로 조초가나 바사아 파하거너 버서어 허고노도 소오조 라마바사 카타파 러머버서 커터허 모보소오 나</aside>
</section>
