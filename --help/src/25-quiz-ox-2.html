  <div class="head"><p class="qtag" style="align-self:flex-start">오조초가</p><h2 class="title">조초가 바사아자 파하거 버서어저 허고노 소오</h2></div>
  <div class="row" style="flex:1;min-height:0;gap:32px"><div class="card" data-step="1" style="padding:24px 32px;gap:12px;flex:1;justify-content:center"><p class="body">초가나다 사아자 하거너더 서어저 고노도로 오조초 마바사아 타파하 머버서어 터</p><div class="row" style="gap:20px"><span style="font-size:48px;border:2px solid var(--line);border-radius:50%;width:90px;height:90px;display:grid;place-items:center">O</span><span style="font-size:48px;border:2px solid var(--line);border-radius:50%;width:90px;height:90px;display:grid;place-items:center">X</span></div></div><div class="card" data-step="2" style="padding:24px 32px;gap:12px;flex:1;justify-content:center;background:var(--blue-soft)"><div class="qrow" data-step="2"><span class="ox o">O</span><p class="qt">가나다 아자차카 거너더 어저처커 노도로 조초가나 바사아</p></div></div></div>
