<section class="slide" data-archetype="flashcards" data-variant="picture-word" style="gap:32px">
  <div class="head"><p class="eyebrow">터허고 보소오조 다라마</p><h2 class="title">허고노도 소오조 라마바사 카타파 러머</h2></div>
  <div class="fcards" style="grid-template-columns:repeat(4,1fr)">
    <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><svg class="ico" aria-hidden="true" style="width:120px;height:120px;color:var(--accent)"><use href="#i-book"/></svg></span><span class="fc-back"><span class="fc-no">1</span><span style="font-size:44px;font-weight:700">고노도 오조초</span><span class="body" style="font-size:24px;color:var(--soft)">노도로모 조초가 바사아자 파하거 버서</span></span></span></button>
    <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><svg class="ico" aria-hidden="true" style="width:120px;height:120px;color:var(--accent)"><use href="#i-clock"/></svg></span><span class="fc-back"><span class="fc-no">2</span><span style="font-size:44px;font-weight:700">도로모 초가나</span><span class="body" style="font-size:24px;color:var(--soft)">로모보소 가나다 아자차카 거너더 어저</span></span></span></button>
    <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><svg class="ico" aria-hidden="true" style="width:120px;height:120px;color:var(--accent)"><use href="#i-bulb"/></svg></span><span class="fc-back"><span class="fc-no">3</span><span style="font-size:44px;font-weight:700">모보소 나다라</span><span class="body" style="font-size:24px;color:var(--soft)">보소오조 다라마 차카타파 더러머 처커</span></span></span></button>
    <button type="button" class="fc"><span class="fc-in"><span class="fc-front"><svg class="ico" aria-hidden="true" style="width:120px;height:120px;color:var(--accent)"><use href="#i-flag"/></svg></span><span class="fc-back"><span class="fc-no">4</span><span style="font-size:44px;font-weight:700">소오조 라마바</span><span class="body" style="font-size:24px;color:var(--soft)">오조초가 마바사 타파하거 머버서 터허</span></span></span></button>
  </div>
  <aside class="notes">조초가 바사아자 파하거 버서어저 허고노 소오조초 라마바 카타파하 러머버 커터허고 모보소 나다라마 자차카 너더러머 저처커 도로모보 초가나 사아자차 하거너 서어저처 고노도 오조초가 마바사 타파하거 머버서 터허고노 보소오 다라마바 차카타 더러머버 처커터 로모보소 가나다 아자</aside>
</section>
