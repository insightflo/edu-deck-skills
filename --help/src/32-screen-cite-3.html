      <figcaption class="sc-cap"><p class="sc-line"><span class="sc-src" data-src="F01"><b>도로모 초가나다 사아자</b>, 「로모보소 가나다 아자차카 거너더」</span><span class="sc-date">모보소 나다</span></p><p class="sc-gist"><b>이 화면이 증명하는 것</b> — 보소오조 다라마 차카타파 더러머 처커터허 로</p></figcaption></figure><div class="col" style="width:500px;flex:none;gap:18px"><div class="card" data-step="1" style="padding:24px 32px;gap:12px;"><span class="mk">1</span><h3 style="font-size:30px">소오조 라마바사 카타파</h3><p class="small">오조초가 마바사 타파하거 머버서 터허고노 보</p></div><div class="card" data-step="2" style="padding:24px 32px;gap:12px;background:var(--blue-soft)"><span class="mk">2</span><h3 style="font-size:30px">조초가 바사아자 파하거</h3><p class="small">초가나다 사아자 하거너더 서어저 고노도로 오</p></div></div></div>
