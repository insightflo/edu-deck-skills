<!-- 마무리 — 53-verdict 의 banner 변형(P4-c) 실사용: 단색 색면 + 대형 타이포의 '한 방' 선언.
     색면은 파트 톤 범위 안이라 파트 1의 깊은 톤(--part-tone)으로 물든다 — 덱을 관통한
     톤 이야기의 종착점. 그라데이션은 쓰지 않는다. 아키타입은 덱 흐름상 closing. -->
<section class="slide" data-archetype="closing" data-variant="banner" data-sec="45" style="padding:0;background:var(--part-tone,var(--accent))">
  <div class="col" style="flex:1;min-height:0;justify-content:center;align-items:center;gap:44px;text-align:center;padding:0 var(--s16)">
    <p style="font-size:32px;font-weight:700;letter-spacing:8px;color:var(--paper)">합의로 마무리</p>
    <h2 class="big" style="font-size:150px;line-height:1.05;color:var(--paper)">기록이 결정이다</h2>
    <div style="width:160px;height:6px;background:var(--paper)"></div>
    <p style="font-size:34px;font-weight:700;color:var(--paper)">다음 회의부터 결정 로그 한 장</p>
  </div>
  <aside class="notes">장 전체가 단색 색면입니다 — 파트 1의 톤이 마지막 장을 통째로 물들입니다. 선언 한 줄 '기록이 결정이다'를 천천히 한 번 읽고 3초 쉽니다 — 이 한 줄이 덱 전체의 요점입니다. 아래 부기 '다음 회의부터 결정 로그 한 장'을 읽어 행동으로 연결하고, 질문을 받으며 닫습니다.</aside>
</section>
