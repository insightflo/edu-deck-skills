<!-- 38-part-divider quiet 변형의 골격을 라이트 면으로 옮긴 변형 + data-tone="1".
     이 장에서 P4 무드 장치 두 개가 함께 보인다 — 배경은 톤 1의 6% 색면(P4-a, 파트가 바뀌면
     온기가 바뀐다), 표면은 .dots-bg 점 격자(P4-b), 위쪽 6px 톤 선(P1-c)은 자동으로 붙는다.
     숨고르기 장 — 소리 없이 파트를 넘긴다. -->
<section class="slide center dots-bg" data-archetype="part-divider" data-variant="quiet" data-tone="1" data-sec="15" style="gap:28px">
  <p class="num" style="font-size:120px;color:var(--part-tone,var(--accent))">1</p>
  <div class="col" style="gap:14px;align-items:center">
    <h2 class="title" style="font-size:44px">결정이 느려지는 자리</h2>
    <p class="small" style="font-size:26px;color:var(--soft)">느린 결정은 의지의 문제가 아니라 구조의 문제입니다</p>
  </div>
  <aside class="notes">짧게 숨 고르는 장입니다 — 파트 이름만 읽고 바로 넘깁니다. 화면 위쪽의 가는 색 띠와 장 전체의 옅은 온기가 파트 1의 톤이라는 것을 한 줄로 알립니다 — 같은 톤이 이어지는 본문 장의 눈금 표시에도 남아 있습니다. 배경의 점 격자는 표지와 이 구분 장에만 쓴다고 덧붙입니다.</aside>
</section>
