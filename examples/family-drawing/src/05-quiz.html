<!-- T5 퀴즈 — .chk 계약: 명조 질문 + 선 패널 보기 + 정답 마진 상자.
     B 카드의 정답 표시(버밀리언 체크·상자)는 data-step 1 로 진행자가 연다. -->
<section class="slide s5" data-archetype="check" data-sec="60" id="s5">
  <div class="pt-pill pos tq">퀴즈 1</div>
  <div class="chk" data-review="cash-flow">
    <p class="chk-q">어느 회사가 더<br>건강할까요?</p>
    <div class="chk-opts">
      <button class="chk-o pt-quiz" type="button">
        <span class="pt-qb serif">A</span>
        <p class="txt"><span>매출과 이익이 큰 회사입니다. 그런데 영업현금은 계속 빠져나가고 있습니다. <span class="ex">(예시)</span></span></p>
      </button>
      <button class="chk-o pt-quiz" type="button" data-ok>
        <span class="pt-qb serif">B</span>
        <svg class="s5-tick" width="100" height="80" viewBox="0 0 100 80" fill="none" aria-hidden="true">
          <path d="M12,44 L38,70 L90,6" stroke="#E34D2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="txt"><span>매출은 평범합니다. 그런데 이익만큼 현금이 들어오고, 빚도 적습니다. <span class="ex">(예시)</span></span></p>
      </button>
    </div>
    <p class="chk-why">답은 B — 숫자의 크기보다 현금 흐름과 빚의 무게를 먼저 봅니다.</p>
  </div>

  <div class="s5-stem" data-step="1"></div>
  <div class="pt-callout s5-memo" data-step="1">
    <div class="h"><span style="letter-spacing:.06em">정답</span>&nbsp;&nbsp;답은 B —</div>
    <div class="b">숫자의 크기보다 현금 흐름과 빚의 무게를 먼저 봅니다.</div>
  </div>
  <aside class="notes">퀴즈입니다. 먼저 두 패널을 읽고 손을 들어 고르게 하세요. A는 크지만 현금이 새는 회사, B는 평범하지만 이익만큼 현금이 들어오고 빚이 적은 회사입니다. 발표자는 →를 눌러 정답 마진 상자를 열고, 화면을 직접 쓰는 학생은 패널을 눌러 채점을 봅니다 — 정답 패널에는 버밀리언 체크가 그어집니다.</aside>
</section>
