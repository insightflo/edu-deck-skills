function artMatrix(g,t,ph){let r=g.createLinearGradient(0,0,W,H);r.addColorStop(0,'#07101f');r.addColorStop(1,'#120b20');g.fillStyle=r;g.fillRect(0,0,W,H);grid(g,'rgba(124,215,255,.045)');const names=['fade','fold','wash','flaps','slam','daybreak','line','tear','portal-in','portal-out'];for(let i=0;i<10;i++){const col=i%5,row=(i/5)|0,x=760+col*210,y=270+row*180,hot=(Math.floor(t*2)%10)==i;g.fillStyle=hot?'rgba(124,215,255,.16)':'rgba(255,255,255,.055)';g.strokeStyle=hot?'#7cd7ff':'rgba(255,255,255,.13)';g.lineWidth=hot?3:1;round(g,x,y,180,140,16);g.fill();g.stroke();g.fillStyle=hot?'#eaf8ff':'#b9c5d8';g.font='700 21px -apple-system,sans-serif';g.fillText(i,x+20,y+36);g.font='600 20px -apple-system,sans-serif';g.fillText(names[i],x+20,y+68);g.strokeStyle=hot?'#ffc36a':'rgba(255,195,106,.35)';g.lineWidth=3;g.beginPath();for(let k=0;k<56;k++){const xx=x+20+k*2.5,yy=y+108+Math.sin(k*.2+i+t*2)*(5+(i%4)*2);k?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.stroke()}}
function artSound(g,t,ph){g.fillStyle='#f5efe4';g.fillRect(0,0,W,H);let r=g.createRadialGradient(1420,420,20,1420,420,760);r.addColorStop(0,'rgba(255,195,106,.35)');r.addColorStop(1,'rgba(255,195,106,0)');g.fillStyle=r;g.fillRect(0,0,W,H);grid(g,'rgba(42,45,52,.04)');for(let j=0;j<5;j++){g.strokeStyle=['#15202c','#126b8f','#d28b36','#8295a8','#15202c'][j];g.lineWidth=j?3:7;g.beginPath();for(let x=80;x<1840;x+=9){const u=x/W,env=Math.sin(u*Math.PI),y=590+Math.sin(x*.018*(j+1)+t*(2+j))*54*env+Math.sin(x*.047+t*3)*12;x==80?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}g.fillStyle='#15202c';g.font='700 26px -apple-system,sans-serif';['Oscillator','Biquad Filter','Convolver','Master'].forEach((n,i)=>{const x=250+i*410,y=850;round(g,x,y,250,82,18);g.globalAlpha=.92;g.fill();g.globalAlpha=1;g.fillStyle='#fff';g.textAlign='center';g.fillText(n,x+125,y+51);g.textAlign='left';g.fillStyle='#15202c'})}
function artClosing(g,t,ph){g.fillStyle='#040508';g.fillRect(0,0,W,H);for(let i=0;i<12;i++){const rr=90+i*56+Math.sin(t+i)*12;g.strokeStyle='rgba(124,215,255,'+(.2-i*.012)+')';g.lineWidth=1.5;g.beginPath();g.ellipse(1450,460,rr*1.25,rr,0,0,TAU);g.stroke()}let r=g.createRadialGradient(1450,460,0,1450,460,520);r.addColorStop(0,'rgba(255,195,106,.28)');r.addColorStop(.45,'rgba(124,215,255,.08)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.045)';grid(g,g.strokeStyle)}
const ARTS=[artLamp,artShader,artMatrix,artSound,artClosing];
function drawScene(g,si,bi,phase,t){
 const sc=SCENES[si],b=sc.beats[bi],dark=si!=1&&si!=3;g.clearRect(0,0,W,H);ARTS[si](g,t,phase);
 const x=si==4?110:120,base=si==1?210:250,maxw=si==4?920:(si==2?540:980);let endY=words(g,b.headline,x,base,maxw,si==0?76:68,dark?'#f7f1e6':'#12161f',phase);
 copy(g,b.sub,x,endY+70,maxw,34,dark?'#7cd7ff':'#126b8f',clamp(phase*2-.4,0,1),1.3,650);
 bullets(g,b.points,x,endY+156,phase,dark?'#dbe2ee':'#29303c',dark);
 g.fillStyle=dark?'rgba(255,255,255,.45)':'rgba(18,22,31,.46)';g.font='600 18px -apple-system,sans-serif';g.fillText((si+1).toString().padStart(2,'0')+' · '+sc.title,120,1000);
}
const VERT='#version 300 es\nlayout(location=0) in vec2 aPos;out vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}';
const FRAG='#version 300 es\nprecision highp float;uniform sampler2D uTexA,uTexB;uniform float uProgress,uDir,uTx,uTime;uniform vec2 uRes;in vec2 vUv;out vec4 outColor;\nfloat hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}vec4 TA(vec2 u){return texture(uTexA,clamp(u,0.,1.));}vec4 TB(vec2 u){return texture(uTexB,clamp(u,0.,1.));}\nvoid main(){vec2 uv=vUv,c=uv-.5;float p=smoothstep(0.,1.,uProgress),dir=uDir;int tx=int(uTx+.5);vec4 a=TA(uv),b=TB(uv),col;\nif(tx==0){col=mix(a,b,p);}\nelse if(tx==1){float sp=1.-p;if(uv.x<sp){float uu=uv.x/max(sp,.001);col=TA(vec2(uu,uv.y))*(1.-.5*p*(1.-uu));}else{float uu=(uv.x-sp)/max(p,.001);col=TB(vec2(uu,uv.y));}col=mix(col,TB(uv),smoothstep(.88,1.,p));}\nelse if(tx==2){float d=(uv.x+uv.y)*.5+(noise(uv*8.+uTime*.15)-.5)*.16;float m=smoothstep(p-.16,p+.16,d);float edge=1.-abs(m*2.-1.);col=mix(b,a,m);col.rgb+=edge*sin(3.14159*p)*vec3(.05,.09,.11);}\nelse if(tx==3){float row=floor(uv.y*6.),sgn=mod(row,2.)*2.-1.;vec2 su=uv+vec2(sgn*p*1.35*dir,0.);float inside=step(0.,su.x)*step(su.x,1.);col=mix(TB(uv),TA(su),inside);}\nelse if(tx==4){vec2 buv=c*mix(1.32,1.,p)+.5,auv=c*mix(1.,1.12,p)+.5;float ab=smoothstep(.12,.9,p);float ca=(1.-p)*.006;vec4 bb;bb.r=TB(buv+vec2(ca,0.)).r;bb.g=TB(buv).g;bb.b=TB(buv-vec2(ca,0.)).b;bb.a=1.;col=mix(TA(auv),bb,ab);}\nelse if(tx==5){float xx=dir<0.?1.-uv.x:uv.x,e=p*1.18;float m=smoothstep(e-.07,e,xx);float glow=exp(-abs(xx-e)*32.)*sin(3.14159*p);col=mix(b,a,m);col.rgb+=glow*vec3(1.05,.62,.25);}\nelse if(tx==6){float yy=abs(uv.y-.5)*2.;float m=1.-smoothstep(p-.03,p+.03,yy);float side=sign(uv.x-.5)*p*.06*(1.-p);col=mix(TA(uv+vec2(side,0.)),TB(uv),m);col.rgb+=(1.-abs(m*2.-1.))*sin(3.14159*p)*vec3(.4,.8,1.);}\nelse if(tx==7){float d=uv.x*.72+uv.y*.28+(noise(vec2(uv.y*10.,uTime*.1))-.5)*.075;float m=smoothstep(p-.018,p+.018,d);float edge=(1.-abs(m*2.-1.))*sin(3.14159*p);col=mix(b,a,m);col.rgb-=edge*vec3(.18);col.rgb+=edge*edge*vec3(.08);}\nelse{vec2 q=c*vec2(uRes.x/uRes.y,1.);float r=length(q),rad,mr=length(vec2(uRes.x/uRes.y,1.)*.5)+.04;vec2 buv;float inside;if(tx==8){rad=p*mr;buv=c*mix(1.55,1.,p)+.5;inside=1.-smoothstep(rad-.025,rad+.025,r);col=mix(TA(uv),TB(buv),inside);}else{rad=(1.-p)*mr;buv=c*mix(1.,1.35,p)+.5;inside=1.-smoothstep(rad-.025,rad+.025,r);col=mix(TB(uv),TA(buv),inside);}float ring=exp(-abs(r-rad)*70.)*sin(3.14159*p);col.rgb+=ring*vec3(.35,.85,1.15);}\ncol.rgb=aces(max(col.rgb,0.));float vig=1.-smoothstep(.25,1.05,length(c*vec2(1.15,1.)));col.rgb*=mix(.76,1.,vig);outColor=vec4(col.rgb,1.);}';
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
function initGL(){gl=stage.getContext('webgl2',{preserveDrawingBuffer:HEADLESS,antialias:true,alpha:false});if(!gl){fallback=true;return false}prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,VERT));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);texA=mktex();texB=mktex();['uTexA','uTexB','uProgress','uDir','uTx','uTime','uRes'].forEach(n=>uni[n]=gl.getUniformLocation(prog,n));gl.uniform1i(uni.uTexA,0);gl.uniform1i(uni.uTexB,1);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);return true}
function mktex(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));return t}
function upload(tex,src,unit){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src)}
function resize(){const d=Math.min(devicePixelRatio||1,2),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);if(stage.width!==w||stage.height!==h){stage.width=w;stage.height=h}if(gl)gl.viewport(0,0,w,h)}
function drawGL(t){drawScene(og,state.si,state.bi,beatPhase(t),t);upload(texB,off,1);let p=1,txv=0,dir=1;if(trans){p=clamp((t-trans.t0)/trans.dur,0,1);txv=trans.tx;dir=trans.dir}gl.uniform1f(uni.uProgress,p);gl.uniform1f(uni.uDir,dir);gl.uniform1f(uni.uTx,txv);gl.uniform1f(uni.uTime,t);gl.uniform2f(uni.uRes,stage.width,stage.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function draw2D(t){drawScene(og,state.si,state.bi,beatPhase(t),t);const g=stage.getContext('2d');g.drawImage(off,0,0,stage.width,stage.height);if(trans){const p=ease(clamp((t-trans.t0)/trans.dur,0,1));g.save();g.globalAlpha=1-p;g.drawImage(snap,0,0,stage.width,stage.height);g.restore()}}
let AC=null,master=null,filt=null,convH=null,convR=null;
function impulse(sec,decay){const rate=AC.sampleRate,len=rate*sec,buf=AC.createBuffer(2,len,rate);for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return buf}
function audio(){if(AC)return AC;const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;AC=new Ctx();master=AC.createGain();master.gain.value=muted?0:.45;filt=AC.createBiquadFilter();filt.type='lowpass';filt.frequency.value=5200;filt.Q.value=.7;convH=AC.createConvolver();convH.buffer=impulse(1.9,2.7);convR=AC.createConvolver();convR.buffer=impulse(.65,3.6);master.connect(filt);filt.connect(AC.destination);convH.connect(filt);convR.connect(filt);return AC}
function tone(freq,dur,type='sine',gain=.18,slide=0,space){if(muted||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);g.connect(space==='room'?convR:convH);o.start(t);o.stop(t+dur+.03)}
function sfx(kind){if(!AC)return;if(kind==='beat'){tone(880,.18,'sine',.09,180,'room');tone(1320,.12,'triangle',.035,-80,'room')}else{tone(72,.42,'sine',.22,-28,'hall');tone(240,.28,'sawtooth',.035,320,'hall');setTimeout(()=>tone(920,.12,'triangle',.045,120,'hall'),80)}}
function parseHash(){const m=location.hash.match(/^#([A-Za-z0-9]+)-(\d+)/);if(!m)return null;let si=SCENES.findIndex(s=>s.id===m[1]);if(si<0){const n=parseInt(m[1],10);if(n>=1&&n<=SCENES.length)si=n-1}if(si<0)return null;const bi=clamp(parseInt(m[2],10)-1,0,SCENES[si].beats.length-1);return{si,bi}}
function setHash(){const h='#'+SCENES[state.si].id+'-'+(state.bi+1);if(location.hash!==h)history.replaceState(null,'',h)}
function startBeat(){beatStart=performance.now()/1000;updateHud();sfx('beat')}
function snapshot(){drawScene(og,state.si,state.bi,beatPhase(),performance.now()/1000);sg.clearRect(0,0,W,H);sg.drawImage(off,0,0);if(gl)upload(texA,snap,0)}
function jump(to,tx,dir=1,instant=QUICK){tx=tx==null?SCENES[to.si].enterWith:tx;lastTx=tx;if(instant||!gl){trans=null;state={si:to.si,bi:to.bi};setHash();startBeat();return}snapshot();const now=performance.now()/1000;trans={tx,dir,t0:now,dur:.92,from:{si:state.si,bi:state.bi}};state={si:to.si,bi:to.bi};setHash();startBeat();sfx('transition')}
function flatIndex(s=state.si,b=state.bi){let n=0;for(let i=0;i<s;i++)n+=SCENES[i].beats.length;return n+b}
function locate(n){let si=0;while(n>=SCENES[si].beats.length){n-=SCENES[si].beats.length;si++}return{si,bi:n}}
function next(){const total=SCENES.reduce((a,s)=>a+s.beats.length,0);jump(locate((flatIndex()+1)%total),null,1)}
function prev(){const total=SCENES.reduce((a,s)=>a+s.beats.length,0);jump(locate((flatIndex()-1+total)%total),null,-1)}
function updateHud(){const sc=SCENES[state.si],b=sc.beats[state.bi],light=state.si==1||state.si==3;document.body.classList.toggle('lightui',light);$('#hudTL').innerHTML='<b>'+sc.hud+'</b>';$('#hudTR').textContent='BEAT '+(state.bi+1)+' / '+sc.beats.length;$('#hudBL').textContent=b.headline;$('#hudBR').textContent=(auto?'AUTO · ':'')+(muted?'MUTED':'SOUND')+' · TX '+lastTx;$('#notesList').innerHTML=sc.notes.map(x=>'<li>'+x+'</li>').join('')}
function captureThumbs(){thumbs=SCENES.map((sc,si)=>{const c=document.createElement('canvas');c.width=480;c.height=270;drawScene(og,si,0,1,performance.now()/1000+si);c.getContext('2d').drawImage(off,0,0,480,270);return c.toDataURL('image/jpeg',.82)})}
function renderOverview(){captureThumbs();$('#ovgrid').innerHTML=SCENES.map((s,i)=>'<div class="ovcard" data-si="'+i+'"><img src="'+thumbs[i]+'" alt=""><span>'+(i+1)+'. '+s.title+'</span><em>'+s.hud+' · '+s.beats.length+' beats</em></div>').join('');document.querySelectorAll('.ovcard').forEach(el=>el.onclick=()=>{jump({si:+el.dataset.si,bi:0});$('#overview').classList.add('hidden')})}
async function warmAll(){const bar=$('#loadbar'),msg=$('#loadmsg'),step=(p,m)=>{bar.style.width=p+'%';msg.textContent=m;return new Promise(r=>setTimeout(r,30))};await step(12,'Opening presentation · WebGL2 context');resize();let ok=false;try{ok=initGL()}catch(e){console.warn(e);ok=false;if(gl){const ns=stage.cloneNode(false);stage.replaceWith(ns);stage=ns;gl=null}}fallback=!ok;await step(42,'GLSL 300 es transition shader compile');if(ok){gl.useProgram(prog);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}await step(68,'5개 장면 썸네일 준비');captureThumbs();await step(92,'발표 상태와 URL 해시 동기화');const h=parseHash();if(h)state=h;setHash();updateHud();renderOverview();await step(100,'Ready');window.ready=true;if(QUICK)$('#load').style.display='none';else $('#load').classList.add('done')}
function frame(ms){const t=ms/1000;resize();if(trans&&t-trans.t0>=trans.dur)trans=null;if(fallback)draw2D(t);else if(gl)drawGL(t);if(auto&&!trans){const b=SCENES[state.si].beats[state.bi],el=t-beatStart;if(el>b.dur+b.delay+b.hold)next()}requestAnimationFrame(frame)}
function key(e){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft')prev();else if(e.key==='n'||e.key==='N')$('#notes').classList.toggle('hidden');else if(e.key==='o'||e.key==='O'){renderOverview();$('#overview').classList.toggle('hidden')}else if(e.key==='m'||e.key==='M'){muted=!muted;if(master)master.gain.value=muted?0:.45;updateHud()}else if(e.key==='a'||e.key==='A'){auto=!auto;updateHud()}else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}else if(e.key==='.')document.body.classList.toggle('blackout');else if(/^[0-9]$/.test(e.key)){const tx=+e.key,jumpTo=locate((flatIndex()+1)%SCENES.reduce((a,s)=>a+s.beats.length,0));jump(jumpTo,tx,1)}}
function gesture(){const ac=audio();if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
addEventListener('keydown',e=>{gesture();key(e)});addEventListener('pointerdown',gesture);addEventListener('resize',resize);addEventListener('hashchange',()=>{const h=parseHash();if(h&&(h.si!==state.si||h.bi!==state.bi))jump(h,null,1)});
window.webglDeck={state:()=>({sceneIndex:state.si,beatIndex:state.bi,scene:SCENES[state.si].id,beat:state.bi+1,transitioning:!!trans,auto,muted,fallback}),goto:(s,b=1)=>{let si=typeof s==='number'?s-1:SCENES.findIndex(x=>x.id===s);if(si>=0)jump({si,bi:clamp(b-1,0,SCENES[si].beats.length-1)})},next,prev,setTransition:(tx=0)=>jump(locate((flatIndex()+1)%15),tx,1),warmAll,scenes:SCENES};
warmAll();requestAnimationFrame(frame);
</script>
