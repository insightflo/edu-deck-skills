<!doctype html>
<!--
  edu-deck-solo 셸 (assets/shell.html)
  [파일 목적] 모든 교육 덱이 함께 쓰는 뼈대. 핵심 CSS(디자인 토큰, 기본 클래스, 모형 창, 단계 등장),
    발표 엔진 JS, 화면 크롬(진행 막대, 단계 점, 쪽수, 도움말, 발표자 노트 창)을 담는다.
  [주요 흐름] scripts/build_deck.py가 이 파일을 읽어 표식 5곳을 채운다.
    제목 표식(TITLE, 중괄호 두 겹) ← deck.json 의 title
    추가 CSS 표식(EXTRA_CSS 주석) ← assets/css/*.css + 덱 src/*.css
    아이콘 표식(ICONS 주석) ← assets/icons/*.svg + 덱 src/*.svg 의 symbol·marker
    슬라이드 표식(SLIDES 주석) ← 덱 src/*.html 조각 (파일 이름순)
    자습 데이터 표식(STUDY_DATA 주석) ← deck.json 의 선택 키 summary/glossary (window.EDU_STUDY, 없으면 빈 칸)
  [외부 연결] 클래스 사용법은 references/classes.md, 검사 기준은 scripts/check_deck.py.
  [수정시 주의] 표식 문자열을 바꾸거나 이 주석에 그대로 적으면 빌드가 깨진다.
    단계 속성(data-step/add/only/lit/until)과 상태 클래스(active, step-hide, gone, pop, lit, new, thinking)는
    모든 조각과 check_deck.py가 기대하는 계약이다. 바꾸면 classes.md와 check_deck.py도 함께 고친다.
-->
<html lang="ko" class="ed-deck">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 엔진 준비 표시: ed-js=스크립트 동작, ed-ready=엔진 초기화 완료, ed-fail=실패/3초 초과.
   실패하면 viewer.css 가 모든 슬라이드를 폭에 맞춰 이어서 보여 준다. */
var deckRoot=document.documentElement;
deckRoot.classList.add('ed-js');
window.addEventListener('error',function(ev){
  if(deckRoot.classList.contains('ed-ready'))return;
  var text=String((ev&&ev.message)||ev);
  if(/ResizeObserver/.test(text))return;
  deckRoot.classList.add('ed-fail');
},true);
setTimeout(function(){ if(!deckRoot.classList.contains('ed-ready'))deckRoot.classList.add('ed-fail'); },3000);
</script>
<title>{{TITLE}}</title>
<style>
/*CORE_CSS*/
/*COMMON_CSS*/
</style>
<style>
/* ---------- 셸 보강: 토큰 ---------- */


/* ---------- 셸 보강: 읽기 쉬움 (참고 덱보다 대비·최소 글자를 조금 올림, 모양은 그대로) ---------- */
.mk,.input .send{background:var(--accent-deep)}
.av{font-size:20px}
.side .sec{font-size:20px;color:var(--muted)}
.input .ph{color:var(--soft)}
/* 어두운·주황 바탕 위 카드: 밝은 글자색을 물려받아 종이색 카드 위에서 안 보이는 것(대비 1.1~1.7)을 막는다 */
.card{color:var(--ink)}
.dark .card .body,.dark .card .small{color:var(--soft)}
.orange .body,.orange .small{color:var(--ink)}
/* 단계 등장 효과는 translate 속성으로 움직인다. transform 을 쓰면 요소 자체의 transform
   (도장 기울기, 대화상자 가운데 맞춤, SVG <g transform>)을 0.45초 동안 덮어써 모양·자리가 틀어진다 */

/* 글꼴 순서: macOS 에서 Office 가 깔린 맑은 고딕보다 Apple SD Gothic Neo 를 먼저 쓴다(Windows 는 그대로 맑은 고딕) */
body{font-family:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR','Noto Sans CJK KR',sans-serif}

/* ---------- 모형 창 내부 변형: 문서 · 표 · 입력 양식 · 메일 · 메신저 ---------- */
/* 문서(공문·보고서·점검표 종이) */
.doc{flex:1;min-width:0;background:var(--paper);padding:32px 48px;display:flex;flex-direction:column;gap:16px;color:var(--ink)}
.doc-title{font-size:32px;font-weight:800;color:var(--ink);text-align:center;letter-spacing:2px}
.doc-meta{display:flex;flex-wrap:wrap;gap:8px 32px;font-size:20px;color:var(--soft);border-bottom:2px solid var(--accent-light);padding-bottom:8px}
.doc p{font-size:24px;line-height:1.55}
.doc .hl-line{background:var(--light);border-radius:var(--r1);box-shadow:var(--shadow-1)}
.doc .bad-line{color:var(--accent-text);text-decoration:line-through;text-decoration-color:var(--accent)}
.doc-sign{margin-top:auto;display:flex;justify-content:flex-end;align-items:center;gap:16px;font-size:22px;color:var(--soft)}
.stamp{width:76px;height:76px;flex:none;border:2px solid var(--accent-text);border-radius:50%;color:var(--accent-text);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
/* 표(엑셀 같은 시트) */
.xl{border-collapse:collapse;width:100%;font-size:21px;color:var(--ink);background:var(--paper)}
.xl th,.xl td{border:1px solid var(--accent-light);padding:8px 16px;text-align:left;white-space:nowrap}
.xl thead th{background:var(--light);color:var(--soft);font-size:20px;font-weight:500;text-align:center}
.xl tbody th{width:56px;background:var(--light);color:var(--soft);font-size:20px;font-weight:500;text-align:center}
.xl tr.hd td{background:var(--light);font-weight:700;color:var(--ink)}
.xl td.n{text-align:right;font-variant-numeric:tabular-nums}
.xl td.hot{background:var(--paper);outline:2px solid var(--accent);outline-offset:-3px;font-weight:700;color:var(--accent-text)}
.xl td.bad{background:var(--paper);color:var(--accent-text);font-weight:700}
.xl-wrap{flex:1;min-width:0;padding:16px 24px;background:var(--paper);display:flex;flex-direction:column;gap:16px}
.xl-formula{display:flex;align-items:center;gap:16px;font-size:20px;color:var(--soft);border:2px solid var(--accent-light);border-radius:var(--r1);padding:8px 16px}
.xl-formula b{color:var(--blue)}
/* 입력 양식(신청서·시스템 화면) */
.fm{flex:1;min-width:0;background:var(--paper);padding:24px 32px;display:flex;flex-direction:column;gap:16px}
.fm-row{display:flex;align-items:center;gap:16px}
.fm-row label{width:180px;flex:none;font-size:22px;font-weight:700;color:var(--soft)}
.fm-in{flex:1;min-width:0;border:2px solid var(--muted);border-radius:var(--r2);padding:8px 16px;font-size:22px;color:var(--ink);background:var(--paper)}
.fm-in.ph{color:var(--soft)}
.fm-in.hot{border-color:var(--accent);background:var(--paper)}
.fm-check{display:flex;align-items:center;gap:16px;font-size:22px;color:var(--soft)}
.cb{width:26px;height:26px;flex:none;border:2px solid var(--soft);border-radius:var(--r1);display:inline-flex;align-items:center;justify-content:center}
.cb.on{background:var(--blue);border-color:var(--blue)}
.cb.on::after{content:"✓";color:var(--paper);font-size:18px;font-weight:800}
.fm-btns{display:flex;justify-content:flex-end;gap:16px;margin-top:auto}
.btn{font-size:22px;font-weight:700;border-radius:var(--r2);padding:8px 24px;background:var(--light);color:var(--soft)}
.btn.primary{background:var(--blue);color:var(--paper)}
.btn.go{background:var(--accent);color:var(--paper)}
/* 메일 */
.mail{flex:1;min-width:0;background:var(--paper);display:flex;flex-direction:column}
.mail-h{display:flex;flex-direction:column;gap:8px;padding:16px 32px;border-bottom:2px solid var(--accent-light)}
.mail-h p{font-size:21px;color:var(--soft)}
.mail-h p b{display:inline-block;width:84px;color:var(--soft)}
.mail-h .subj{font-size:28px;font-weight:800;color:var(--ink)}
.mail-b{flex:1;padding:16px 32px;display:flex;flex-direction:column;gap:8px;font-size:23px;line-height:1.6;color:var(--ink)}
/* 메신저(단체방·문자) */
.msgr{flex:1;min-width:0;background:var(--blue-soft);padding:24px 24px;display:flex;flex-direction:column;gap:16px}
.mg{align-self:flex-start;display:flex;flex-direction:column;gap:0px;max-width:80%}
.mg .who{font-size:20px;color:var(--soft)}
.mg p{background:var(--paper);border-radius:var(--r2);padding:16px 16px;font-size:23px;line-height:1.5;color:var(--ink)}
.mg.me{align-self:flex-end;align-items:flex-end}
.mg.me p{background:var(--light);border-radius:var(--r2)}
.mg .tm{font-size:20px;color:var(--soft)}

/* ---------- 참고 자료 슬라이드 ---------- */
.src-list{list-style:none;display:grid;grid-template-columns:1fr;gap:16px}
.src-list.two{grid-template-columns:1fr 1fr}
.src-list li{display:flex;gap:16px;align-items:baseline;background:var(--paper);border:2px solid var(--line);border-radius:var(--r2);padding:16px 24px;font-size:23px;line-height:1.45;color:var(--soft)}
.src-list .sid{flex:none;font-size:22px;font-weight:800;color:var(--blue-text);background:var(--blue-soft);border-radius:var(--r1);padding:0px 8px}
.src-list b{color:var(--ink);font-weight:700}
.src-list a{color:var(--blue);text-decoration:none;word-break:break-all}

/* ---------- 자습 레이어(S 자습 · P 인쇄 · G 용어집)와 확인 문제(.chk) ----------
   클린룸 재작성. st- 접두 클래스는 셸 스크립트(assets/js/study.js)가 런타임에 만든다 —
   원고에는 쓰지 않는다. 표시 토글(st-show·st-fold·st-self·st-printing·hidden)과
   무대 변수(--st-sc·--st-top·--st-k·--st-w·--st-fs)는 엔진이 읽는 계약이라 유지한다. */
/* 자습 패널: 화면 아래 고정. 먹색 바탕에 주황 레일 — 무대는 --st-top/--st-sc 로 위에 맞춘다 */
body.st-self #stage{top:var(--st-top,50%) !important;transform:translate(-50%,-50%) scale(var(--st-sc,1)) !important}
body.st-self .st-panel{display:block}
body.st-self #progress,body.st-self #dots,body.st-self #counter,body.st-self #help{display:none}

/* 저자 검수 뷰어 모드(?sheet·?shot — assets/js/sheet.js): URL 파라미터로만 켜진다.
   접촉판(?sheet)은 전 장을 3단 그리드(1/3 축소)로 늘어놓고 번호표를 단다 — diagrams.md 의
   “전 장 축소판을 직접 본다”를 URL 하나로. ?shot=N 은 한 장만 깨끗하게(캡처용).
   인쇄·발표 동작은 건드리지 않는다(파라미터 없으면 어떤 규칙도 걸리지 않는다). */
@media screen{
html.is-sheet body,html.is-shot body{overflow:auto;height:auto;background:var(--paper)}
html.is-sheet #progress,html.is-sheet #dots,html.is-sheet #counter,html.is-sheet #help,
html.is-shot #progress,html.is-shot #dots,html.is-shot #counter,html.is-shot #help,
html.is-sheet .ed-reader-nav,html.is-shot .ed-reader-nav{display:none}
body.st-sheet .step-hide{visibility:visible !important} /* 인쇄와 같은 정적 완결 */
html.is-sheet #stage{position:static !important;transform:none !important;left:auto;top:auto;
  width:max-content;display:grid;grid-template-columns:repeat(var(--sheet-cols,3),640px);gap:16px;padding:16px;
  counter-reset:sheet-n}
html.is-sheet #stage>.slide,html.is-sheet #stage>.deck>.slide{position:relative;left:auto;top:auto;
  transform:scale(.33334);transform-origin:0 0;display:flex !important;width:1920px;height:1080px;
  margin:0 -1280px -720px 0;counter-increment:sheet-n}
html.is-sheet #stage>.slide::after,html.is-sheet #stage>.deck>.slide::after{content:counter(sheet-n);
  position:absolute;right:0;top:0;padding:8px 26px;background:#ffd400;color:#000;
  font-size:52px;font-weight:800;line-height:1.2;font-family:inherit;z-index:9}
}
.st-panel{--st-k:1;--st-w:1400px;display:none;position:fixed;left:0;right:0;bottom:0;z-index:4;padding:calc(10px*var(--st-k)) calc(28px*var(--st-k)) calc(34px*var(--st-k));background:var(--ink);color:var(--light);border-top:3px solid var(--accent);box-shadow:var(--shadow-2)}
.st-pin{width:var(--st-w);max-width:100%;margin:0 auto}
.st-ph{display:flex;align-items:center;flex-wrap:wrap;gap:calc(10px*var(--st-k)) calc(18px*var(--st-k));font-size:calc(18px*var(--st-k));line-height:1.3;padding-bottom:calc(10px*var(--st-k))}
.st-ptag{font-weight:700;color:var(--accent-light);letter-spacing:2px}
.st-ppos{color:var(--soft)}
.st-hint{font-weight:700;color:var(--blue-soft);background:var(--ink);border-radius:var(--r2);padding:calc(2px*var(--st-k)) calc(14px*var(--st-k))}
.st-hint.st-hint-on{color:var(--ink);background:var(--accent-light)}
.st-sp{flex:1}
.st-pbtn{font:inherit;font-size:calc(17px*var(--st-k));font-weight:700;color:var(--blue-soft);background:var(--ink);border:2px solid var(--blue-text);border-radius:var(--r2);padding:calc(10px*var(--st-k)) calc(18px*var(--st-k));cursor:pointer}
.st-pbtn:hover{border-color:var(--accent-light)}
.st-pbtn.st-main{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.st-pbtn.st-off{background:transparent;color:var(--blue-soft)}
.st-pb{font-size:calc(26px*var(--st-k));line-height:1.6;height:calc(26px*1.6*5*var(--st-k) + 6px);overflow-y:auto;padding-right:calc(18px*var(--st-k));word-break:keep-all;scrollbar-color:var(--blue-text) transparent}
.st-pb:focus{outline:none}
.st-txt+.st-txt{margin-top:calc(10px*var(--st-k))}
.st-src{font-size:calc(19px*var(--st-k));line-height:1.5;color:var(--muted);margin-top:calc(10px*var(--st-k))}
.st-empty{color:var(--muted)}
.st-chk{margin-top:10px;font-size:calc(15px*var(--st-k));font-weight:700;color:var(--accent-text)}
body.st-fold .st-pb{display:none}
body.st-fold .st-ph{padding-bottom:0}
/* 알림 한 줄: 화면 위에서 살짝 내려왔다 사라진다 */
.st-toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-12px);z-index:60;max-width:88vw;background:color-mix(in srgb,var(--ink) 94%,transparent);color:var(--light);font:600 16px/1.5 'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;padding:10px 18px;border-radius:var(--r2);opacity:0;pointer-events:none;transition:opacity var(--m2) var(--e-out),transform var(--m2) var(--e-out)}
.st-toast.st-show{opacity:1;transform:translate(-50%,0)}
/* 모달 공통: 어두운 막 위에 종이 상자. st-show 로만 연다 */
.st-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 58%,transparent);padding:28px;font-family:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;color:var(--ink)}
.st-modal.st-show{display:flex}
.st-mbox{display:flex;flex-direction:column;gap:18px;max-height:100%;min-height:0;background:var(--paper);border-radius:var(--r2);border-top:4px solid var(--accent);box-shadow:var(--shadow-2);padding:28px 36px}
.st-mhead{display:flex;align-items:center;gap:16px}
.st-mh{font-size:26px;font-weight:700}
.st-msub{font-size:16px;color:var(--soft)}
.st-mbtn{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--light);border:2px solid var(--accent-light);border-radius:var(--r2);padding:10px 18px;cursor:pointer;white-space:nowrap}
.st-mbtn:hover{border-color:var(--accent)}
.st-mbtn.st-main{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.st-mbtn:disabled{opacity:.5;cursor:default;border-color:var(--accent-light)}
/* 인쇄 자료 고르기 */
.st-chbox{width:min(480px,100%);align-items:stretch}
.st-chrow{display:flex;gap:18px}
.st-mbtn.st-big{flex:1;font-size:19px;padding:18px 16px;border-radius:var(--r2)}
/* 용어집: 위에 찾기 칸, 아래에 항목 목록 */
.st-glbox{width:min(900px,100%);height:min(84vh,880px)}
.st-gq{font:inherit;font-size:17px;padding:14px 18px;border:2px solid var(--line);border-radius:var(--r2);background:var(--paper);color:var(--ink);outline:none}
.st-gq:focus{border-color:var(--accent)}
.st-gcnt{font-size:14px;color:var(--soft);min-height:1em}
.st-glist{flex:1;min-height:0;overflow-y:auto;padding-right:10px;display:flex;flex-direction:column;gap:14px}
.st-gh{font-size:15px;font-weight:700;color:var(--accent-text);letter-spacing:2px;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:0}
.st-gi{display:flex;gap:18px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.st-gtx{flex:1;min-width:0}
.st-gt{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}

/* 인쇄 미리보기: 전체 화면, 위는 먹색 도구 막대, 아래는 A4 문서 */
.st-print{position:fixed;inset:0;z-index:55;display:none;flex-direction:column;background:var(--soft);font-family:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;color:var(--ink)}
.st-print.st-show{display:flex}
.st-prbar{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;background:var(--ink);color:var(--light);padding:14px 20px;border-bottom:3px solid var(--accent)}

.st-prnote{font-size:13px;color:var(--blue-soft)}
.st-prscroll{flex:1;min-height:0;overflow:auto;padding:36px 16px 72px}
.st-paper{--st-fs:1;width:210mm;min-height:297mm;margin:0 auto;padding:14mm;background:var(--paper);box-shadow:var(--shadow-2);-webkit-print-color-adjust:exact;print-color-adjust:exact;word-break:keep-all;line-height:1.5}
.st-script{min-height:0}
.st-dtop{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:calc(9pt*var(--st-fs));color:var(--soft);border-bottom:2pt solid var(--ink);padding-bottom:calc(6pt*var(--st-fs));letter-spacing:.5px}
.st-dseries{font-weight:700;color:var(--accent-text)}
.st-dtitle{font-size:calc(22pt*var(--st-fs));font-weight:700;line-height:1.2;margin:calc(10pt*var(--st-fs)) 0 calc(6pt*var(--st-fs))}
.st-dlabel{display:inline-block;font-size:.55em;font-weight:700;color:var(--paper);background:var(--accent);border-radius:var(--r1);padding:2pt 7pt;margin-right:8pt;vertical-align:.35em}
.st-sum{font-size:calc(10.5pt*var(--st-fs))}
.st-one{font-size:calc(14pt*var(--st-fs));font-weight:700;line-height:1.4;margin-bottom:calc(6pt*var(--st-fs))}
.st-ana{font-size:calc(10.5pt*var(--st-fs));color:var(--soft);background:var(--light);border-left:3pt solid var(--accent);padding:calc(7pt*var(--st-fs)) calc(10pt*var(--st-fs));margin-bottom:calc(10pt*var(--st-fs))}
.st-anatag{font-weight:700;color:var(--accent-text);margin-right:8pt}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(10pt*var(--st-fs)) calc(18pt*var(--st-fs));margin-bottom:calc(10pt*var(--st-fs))}
.st-sec{break-inside:avoid}
.st-sech{font-size:calc(11pt*var(--st-fs));font-weight:700;color:var(--ink);border-left:3pt solid var(--blue);padding-left:7pt;margin-bottom:calc(5pt*var(--st-fs))}
.st-hot .st-sech{border-left-color:var(--accent)}
.st-warn .st-sech{border-left-color:var(--accent-text)}
.st-list{padding-left:1.4em;display:flex;flex-direction:column;gap:calc(3pt*var(--st-fs))}
.st-list li{line-height:1.5}
.st-list li::marker{font-weight:700;color:var(--soft)}
.st-wide li b{display:block;font-size:1.08em}
.st-lb{display:block;color:var(--soft)}
.st-terms{margin-top:calc(2pt*var(--st-fs))}
.st-tl{display:grid;grid-template-columns:1fr;gap:calc(5pt*var(--st-fs)) calc(16pt*var(--st-fs))}
.st-trow{display:flex;gap:8pt;align-items:baseline;break-inside:avoid}
.st-trow dt{flex:none;min-width:8.5em;font-weight:700}
.st-ten{font-weight:400;color:var(--soft);font-size:.9em}
.st-trow dd{color:var(--soft);font-size:.95em}
.st-tmore{color:var(--soft);margin-top:calc(4pt*var(--st-fs))}
.st-next{font-size:calc(10pt*var(--st-fs));color:var(--soft);margin-top:calc(8pt*var(--st-fs))}
.st-pending{font-size:calc(9pt*var(--st-fs));color:var(--soft);margin-top:calc(10pt*var(--st-fs))}
.st-dfoot{display:flex;justify-content:space-between;font-size:calc(8pt*var(--st-fs));color:var(--soft);border-top:.75pt solid var(--line);margin-top:calc(12pt*var(--st-fs));padding-top:calc(5pt*var(--st-fs))}
.st-script{font-size:11pt}
.st-intro{font-size:9.5pt;color:var(--soft);margin-bottom:10pt}
.st-blk{break-inside:avoid;page-break-inside:avoid;padding:9pt 0 10pt;border-top:.75pt solid var(--line)}
.st-bh{font-size:12.5pt;font-weight:700;line-height:1.35;margin-bottom:4pt}
.st-bn{display:inline-block;min-width:3.2em;font-size:.85em;color:var(--accent-text);margin-right:6pt}
.st-bt{line-height:1.7}
.st-bt+.st-bt{margin-top:3pt}
.st-bsrc{font-size:8.5pt;color:var(--soft);margin-top:4pt;line-height:1.45}
.st-bnone{font-size:9.5pt;color:var(--soft)}
/* 인쇄할 때는 미리보기 문서만 A4로 찍는다(평소 인쇄 규칙은 그대로). */
@media print{
  body.st-printing{background:var(--paper) !important;overflow:visible !important;height:auto !important;width:auto !important}
  html:has(body.st-printing){overflow:visible !important;height:auto !important;width:auto !important;background:var(--paper) !important}
  body.st-printing>*:not(#st-print){display:none !important}
  body.st-printing #st-print{position:static;display:block;background:none;width:auto;height:auto}
  body.st-printing .st-prbar{display:none}
  body.st-printing .st-prscroll{overflow:visible;padding:0}
  body.st-printing .st-paper{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
}
/* 확인 문제(.chk): 보기 단추로 답하고, 틀리면 해설과 복습 단추가 열린다.
   .chk·.chk-q·.chk-n·.chk-opts·.chk-o·.chk-why 는 원고 마크업,
   .chk-fb·.chk-msg·.chk-go·.chk-again·.chk-back 과 chk-done/ok/ng/right/picked 는 셸 스크립트가 단다 */
.chk{display:flex;flex-direction:column;gap:18px;background:var(--paper);border:2px solid var(--accent-light);border-left:8px solid var(--accent-light);border-radius:var(--r2);padding:30px 36px;box-shadow:var(--shadow-2)}
.chk-q{font-size:34px;font-weight:700;line-height:1.4;color:var(--ink)}
.chk-q .chk-n{display:inline-block;min-width:44px;margin-right:16px;padding:2px 14px;border-radius:var(--r2);background:var(--accent-deep);color:var(--paper);font-size:24px;text-align:center;vertical-align:4px}
.chk-opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chk-o{font-family:inherit;font-size:27px;line-height:1.35;text-align:left;color:var(--ink);background:var(--paper);border:2px solid var(--accent-light);border-radius:var(--r2);padding:18px 20px;cursor:pointer}
.chk-o:hover:not(:disabled){border-color:var(--accent);background:var(--paper)}
.chk-o:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.chk-o:disabled{cursor:default}
.chk-done .chk-o:not(.chk-right):not(.chk-picked){opacity:.45}
.chk-o.chk-right{border-color:var(--success);background:var(--light);font-weight:700}
.chk-o.chk-right::before{content:"정답 ";color:var(--success);font-weight:700}
.chk-o.chk-picked:not(.chk-right){border-color:var(--danger);background:var(--paper)}
.chk-o.chk-picked:not(.chk-right)::before{content:"고른 답 ";color:var(--danger);font-weight:700}
.chk-why{display:none}
.chk-fb{display:none;flex-wrap:wrap;align-items:center;gap:16px;border-radius:var(--r2);padding:18px 20px}
.chk-done .chk-fb{display:flex}
.chk-ok .chk-fb{background:var(--light)}
.chk-ng .chk-fb{background:var(--paper)}
.chk-msg{flex:1 1 100%;font-size:26px;font-weight:700}
.chk-ok .chk-msg{color:var(--success)}
.chk-ng .chk-msg{color:var(--danger)}
.chk-fb .chk-why{display:block;flex:1 1 100%;font-size:25px;line-height:1.5;color:var(--soft)}
.chk-go,.chk-again{font-family:inherit;font-size:23px;font-weight:700;border-radius:var(--r2);padding:10px 18px;cursor:pointer}
.chk-go{color:var(--paper);background:var(--ink);border:none}
.chk-ok .chk-go{background:var(--paper);color:var(--ink);border:2px solid var(--blue-soft)}
.chk-again{color:var(--soft);background:transparent;border:2px solid var(--accent-light)}
.chk-back{position:fixed;left:28px;bottom:72px;z-index:9;font:700 17px/1 'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--paper);background:var(--accent);border:none;border-radius:var(--r2);padding:16px 20px;box-shadow:var(--shadow-1);cursor:pointer}
.chk-back[hidden]{display:none}

/* ---------- 움직임 줄이기 설정 존중 ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{}
}

/* ---------- 모션 층: 장·요소 등장 리듬 (iart-ai/motion-skills 기법 이식 — CSS 전용, 틀만 변화)
   규칙: ① transform·opacity만 움직인다(60fps) ② 등장은 ease-out(--eo), 되돌아갈 때는 반대 방향 ③ 
   prefers-reduced-motion 에서는 전부 꺼진다(검사기 2차 패스·움직임 줄이기 설정과 같은 조건) ④ 
   애니메이션은 모두 자연 상태로 끝나므로 인쇄·검사의 안정 상태가 바뀌지 않는다. ---------- */
@media (prefers-reduced-motion: no-preference){
  
  /* 장 등장: 앞으로 넘길 때 아래에서, 뒤로 돌아갈 때 위에서 */
  .slide.active{}
  #stage[data-dir="back"] .slide.active{}
  /* 장 안 공통 요소: 머리(eyebrow→제목)와 칸·줄들이 60ms 간격으로 차례 등장 */
  .slide.active>.head{}
  .slide.active>.head .eyebrow{}
  .slide.active .card,.slide.active .rm-col,.slide.active .todo,.slide.active .qrow,
  .slide.active .lv,.slide.active .pill,.slide.active .tile{}
  .slide.active .card:nth-child(1),.slide.active .rm-col:nth-child(2),.slide.active .todo:nth-child(1),
  .slide.active .qrow:nth-child(1),.slide.active .lv:nth-child(2),.slide.active .pill:nth-child(1),
  .slide.active .tile:nth-child(1){}
  .slide.active .card:nth-child(2),.slide.active .rm-col:nth-child(3),.slide.active .todo:nth-child(2),
  .slide.active .qrow:nth-child(2),.slide.active .lv:nth-child(3),.slide.active .pill:nth-child(2),
  .slide.active .tile:nth-child(2){}
  .slide.active .card:nth-child(3),.slide.active .rm-col:nth-child(4),.slide.active .todo:nth-child(3),
  .slide.active .qrow:nth-child(3),.slide.active .lv:nth-child(4),.slide.active .pill:nth-child(3),
  .slide.active .tile:nth-child(3){}
  .slide.active .card:nth-child(4),.slide.active .rm-col:nth-child(5),.slide.active .todo:nth-child(4),
  .slide.active .qrow:nth-child(4),.slide.active .pill:nth-child(4),.slide.active .tile:nth-child(4){}
  .slide.active .card:nth-child(5),.slide.active .rm-col:nth-child(6),.slide.active .pill:nth-child(5){}
  .slide.active .card:nth-child(6),.slide.active .rm-col:nth-child(7){}
  /* 핵심 문장장(statement·closing): 큰 글자가 늦게 뜨고 알약이 따라온다 */
  .slide.active>.eyebrow{}
  .slide.active>.big{}
  /* 표지: 제목 라인이 마스크 위로 올라온다 */
  .slide.active .cx-eyebrow{}
  .slide.active .cx-title{}
  /* 단계 등장(.pop): 되튕김 이징으로 고친다(포트 규칙보다 뒤에 와 이긴다) */
  .pop{}
  /* 진행 막대: 너비 대신 scaleX(변환만) — 엔진이 scaleX 값을 넣는다 */
  #progress{transition:opacity var(--m2) var(--e-out),transform var(--m2) var(--e-out);}
  /* 단계 점: 켜지는 점이 한 번 부풀었다가 잦아든다 */
  #dots i.on{}
}






/* 진행 막대 기본 상태(게이트 밖): 엔진이 scaleX 로 채운다. 움직임 줄이기에서도 값은 같이 간다 */
#progress{transform-origin:0 50%;transform:scaleX(0)}

/* ---------- 인쇄: 한 쪽에 한 슬라이드, 모든 단계를 펼친 상태 ---------- */
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{width:1920px;height:auto;overflow:visible;background:var(--paper)}
  #stage{position:static;transform:none !important;width:1920px;height:auto}
  .slide{position:relative;display:flex !important;break-after:page;page-break-after:always}
  .step-hide{visibility:visible !important}
  #progress,#dots,#counter,#help,#notes{display:none !important}
  /* 인쇄 창에서 '배경 그래픽'을 꺼도 어두운·주황 바탕과 칩 색을 남긴다 */
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  /* 표지를 한 번도 열지 않고 인쇄하면 등장 애니메이션 전 상태(투명)로 찍히므로 바로 보이게 한다 */
  .cx-tokens span,.cx-sub,.cx-badge{opacity:1 !important;transform:none !important;}
  /* 모션 층도 인쇄에서는 끈다(장·칸 등장 애니메이션이 인쇄 지연·중간 상태를 만들지 않게) */
  .slide.active,.card,.rm-col,.todo,.qrow,.lv,.pill,.tile,#dots i.on{}
}

/* ---------- 도구 층: 자동 발표 표시 · 편집 표시줄 · 탐색 위젯 · 사이드 시트 · 차트 ---------- */
#edAuto{position:fixed;right:28px;bottom:72px;z-index:9;display:none;background:var(--accent);color:var(--paper);font:700 17px/1 'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:10px 16px;border-radius:var(--r2);box-shadow:var(--shadow-1)}
html.ed-auto #edAuto{display:block}
#edEdit{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:16px;background:var(--ink);color:var(--light);font:600 16px/1.3 'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:10px 18px;border-radius:var(--r2);box-shadow:var(--shadow-2)}
body.ed-edit #edEdit{display:flex}
#edEdit .ed-reset{font:inherit;font-size:15px;font-weight:700;color:var(--paper);background:var(--accent);border:none;border-radius:var(--r1);padding:6px 14px;cursor:pointer}
body.ed-edit .slide [data-ed]{cursor:text}
body.ed-edit .slide [data-ed]:hover{outline:2px dashed var(--accent-light);outline-offset:3px}
body.ed-edit .slide [data-ed]:focus{outline:2px solid var(--accent);outline-offset:3px}

/* 탐색 위젯(.expl): 칩으로 연결 상태를 바꾼다. 채점 없음 — 인쇄·자습에서는 모든 상태가 펼쳐진다 */
.expl{display:flex;flex-direction:column;gap:20px;flex:1;min-height:0}
.expl-ctrl{display:flex;flex-wrap:wrap;gap:12px}
.expl-chip{font:inherit;font-size:22px;font-weight:700;color:var(--soft);background:var(--paper);border:2px solid var(--accent-light);border-radius:999px;padding:8px 22px;cursor:pointer}
.expl-chip:hover{border-color:var(--accent)}
.expl-chip.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.expl-state{display:none;flex-direction:column;gap:20px}
.expl-state.on{display:flex}
.expl-cap{font-size:20px;font-weight:700;color:var(--accent-text)}

/* 사이드 시트(.dsheet): 본문 칩이 하단 시트를 올린다. 무대(#stage) 좌표계 안에서 고정 — 주변은 dim 으로 어둡게(blur 없음) */
.dsheet-open{font:inherit;font-size:20px;font-weight:700;color:var(--accent-text);background:var(--light);border:2px solid var(--accent-light);border-radius:999px;padding:6px 18px;cursor:pointer}
.dsheet-open:hover{border-color:var(--accent)}
.dsheet-dim{position:fixed;inset:0;z-index:6;display:none;background:color-mix(in srgb,var(--ink) 55%,transparent)}
.dsheet-dim.on{display:block}
.dsheet-panel{position:fixed;left:50%;bottom:0;z-index:7;width:min(1560px,88%);max-height:64%;overflow:auto;background:var(--paper);border-radius:var(--r2) var(--r2) 0 0;border-top:6px solid var(--accent);box-shadow:var(--shadow-2);padding:28px 36px;display:flex;flex-direction:column;gap:14px;transform:translate(-50%,110%);visibility:hidden;transition:transform var(--m3) var(--e-out),visibility 0s var(--m3)}
.dsheet-panel.on{transform:translate(-50%,0);visibility:visible;transition:transform var(--m3) var(--e-out)}
.dsheet-panel .dsheet-h{display:flex;align-items:center;gap:16px}
.dsheet-panel .dsheet-h h3{margin:0;font-size:26px;font-weight:800;color:var(--ink)}
.dsheet-close{margin-left:auto;font:inherit;font-size:18px;font-weight:700;color:var(--soft);background:transparent;border:2px solid var(--accent-light);border-radius:var(--r1);padding:6px 14px;cursor:pointer}
.dsheet-close:hover{border-color:var(--accent)}
.dsheet-panel .dsheet-b{font-size:23px;line-height:1.6;color:var(--ink)}
.dsheet-panel .dsheet-b p{margin:0}
.dsheet-panel .dsheet-src{font-size:19px;color:var(--soft)}

/* SVG 차트(.chart): 조각 33·34. 네이티브 SVG 만 — 외부 라이브러리 없음 */
.chart{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.chart>svg{flex:1;min-height:0;width:100%}

/* 그림 자리(.fig-slot): 배치(계열 변형)가 주는 빈 그림 칸. 내용은 저작자가 diagrams.md 문법의
   svg.dg(k-* 도형·t-* 글자)로 그린다 — 도형·글자 스타일은 그 규칙이 담당하고 여기서는 자리만 잡는다 */
.fig-slot{margin:0;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.fig-slot>svg.dg{flex:1;min-height:0;width:100%}
.fig-slot figcaption{font-size:22px;line-height:1.5;color:var(--soft)}
.dark .fig-slot figcaption{color:var(--muted)}

/* 미니 흐름(.vflow·.vnode·.varr·.vpills): 카드·본문 안 한 줄/한 줄기 "A → B → C" 인라인 흐름 어휘.
   fig-slot 보다 작은 카드 단위 층 — 도식 문법(svg.dg)이 아니라 HTML 인라인. 독자 등장 모션은 없고
   장 계열 시그니처·data-step 을 따른다. is-on/is-off 도 애니메이션이 아니라 정적 강조다 */
.vflow{display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px}
.vflow.col{flex-direction:column;align-items:flex-start;flex-wrap:nowrap;gap:8px}
.vflow.col .varr{transform:rotate(90deg)}
.vnode{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-size:24px;font-weight:700;line-height:1.3;color:var(--ink);white-space:nowrap}
.vnode.is-on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.vnode.is-off{color:var(--soft);border-style:dashed;text-decoration:line-through}
.dark .vnode.is-off{background:transparent;border-color:var(--muted);color:var(--muted)}
.varr{color:var(--accent);font-size:28px;font-weight:800;line-height:1;flex:none}
.dark .varr{color:var(--accent-light)}
.vpills{display:flex;flex-wrap:wrap;gap:8px}
.vpills .vnode{padding:4px 12px;font-size:22px;font-weight:600}

/* 2×2 사분면(.quad): 두 축(.qax-x 위 · .qax-y 왼쪽 세로쓰기)이 만나는 네 영역 배치.
   칸 목록은 .qgrid>.qcell, 좌표 배치는 .qplot(십자 축선 상대 판) 안 절대 위치 칩(.qp)·거품(.qbub).
   .qp/.qbub 은 CSS translate 속성으로 중심을 맞추므로 계열 시그니처의 transform 프레임과 겹치지 않는다.
   독자 모션 없음 — 장 계열 시그니처·data-step 을 따른다. 축 라벨은 측정값이 아니라 개념 기준이다 */
.quad{display:grid;grid-template-areas:". ax" "ay qg";grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:10px 20px;flex:1;min-height:0}
.qax{display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:800;color:var(--soft);white-space:nowrap}
.qax-x{grid-area:ax}
.qax-y{grid-area:ay;writing-mode:vertical-rl}
.qgrid{grid-area:qg;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;min-height:0}
.qcell{display:flex;flex-direction:column;gap:10px;padding:20px 26px;border-radius:var(--r2);border:2px solid var(--line);background:var(--light);color:var(--ink);min-height:0;overflow:hidden}
.qcell h3{margin:0;font-size:28px;font-weight:800;color:var(--ink)}
.qplot{grid-area:qg;position:relative;border:3px solid var(--line);border-radius:var(--r2);min-height:0}
.qplot::before,.qplot::after{content:"";position:absolute;background:var(--line)}
.qplot::before{left:0;right:0;top:50%;height:2px}
.qplot::after{top:0;bottom:0;left:50%;width:2px}
.qp{position:absolute;translate:-50% -50%}
.qbub{position:absolute;translate:-50% -50%;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;background:var(--accent-soft);border:3px solid var(--accent);color:var(--ink);font-size:22px;font-weight:800}

   (motion.js 위임 핸들러 — 조작 자체는 시그니처가 아니다). 정적 완결에서는 앞·뒷면이 나란히 펼쳐진다 */

<body>
<noscript><p class="ed-nojs" style="display:block">브라우저에서 열면 넘기기·자습이 동작합니다</p></noscript>
<p class="ed-nojs">브라우저에서 열면 넘기기·자습이 동작합니다</p>
<!--STUDY_DATA-->
<div id="stage">
<!--ICONS-->
<!--SLIDES-->
</div>

<div id="progress"></div>
<div id="dots"></div>
<div id="counter"></div>
<div id="help">→ 다음 (한 단계씩) · ← 이전 · F 전체화면 · N 발표자 노트 · S 자습 · P 인쇄 · G 용어집 · A 자동 발표 · E 편집</div>
<div id="notes"><div class="h">발표자 노트 (N으로 닫기)</div><div id="notesText"></div></div>

<script>/*MOTION_JS*/</script>
<script>
/*
  발표 엔진 (클린룸 재구현 — 계약은 그대로, 구현은 새로)
  [목적] 1920×1080 무대를 창 크기에 맞춰 줄이고, 장 넘김과 장 안의 단계 공개를 관리한다.
  [입력] #stage 직계 자식 section.slide 들과 그 안의 단계 속성, aside.notes.
    data-step=k  k단계부터 보임(그 단계에서 .pop 으로 튀어나옴, .a 말풍선은 점 표시 뒤 등장)
    data-add=k   k단계부터 보이고 그 단계에서만 .new 강조(덧붙인 문구 표시)
    data-only=k  k단계에서만 보임(전→후, 질문→답 상태 교체)
    data-lit=k   k단계부터 .lit 유지(정답·강조 칠하기)
    data-until=k k단계까지만 보임
  [출력] .active/.step-hide/.gone/.new/.lit 토글, 진행 막대·단계 점·쪽수, 주소 #N,
    deckstep(detail={slide,step})·deckslide(detail=장 번호) 이벤트.
  [연결] window.deckGo(i,step) 와 window.deckInfo() 는 검사기(scripts/check_deck.py)와
    읽기(responsive.js)·자습(study.js)·타이머(talk.js)·검색(viewer.js) 계층이 부른다.
  [수정시 주의] 속성·클래스·이벤트 이름과 deckstep→deckslide 발생 순서는 계약이다.
    바꾸면 슬라이드 조각·모션·읽기·검사 스크립트가 함께 깨진다.
*/
(function(){
var rootEl=document.documentElement;
try{
  var deckEl=document.getElementById('stage');
  var pages=deckEl?[].slice.call(deckEl.children).filter(function(el){return el.classList.contains('slide')}):[];
  if(!pages.length) return;
  var rail=document.getElementById('progress');
  var pips=document.getElementById('dots');
  var cellNum=document.getElementById('counter');
  var memoBox=document.getElementById('notes');
  var memoBody=document.getElementById('notesText');
  var pos=0, mark=0, memoOn=false;
  var MARKS=['step','add','only','lit','until'];
  var MARK_SEL='[data-'+MARKS.join('],[data-')+']';

  /* 장에 달린 단계 번호 중 가장 큰 값 */
  function topMark(pg){
    var top=0;
    pg.querySelectorAll(MARK_SEL).forEach(function(el){
      MARKS.forEach(function(k){ if(el.dataset[k]!==undefined) top=Math.max(top,+el.dataset[k]); });
    });
    return top;
  }
  /* 방금 열린 요소에 등장 표시. 실제 움직임은 공용 모션 계층이 deckstep 을 보고 그린다 */
  function flag(el){ el.classList.add('pop'); }
  /* 한 장을 depth 단계 상태로 만든다. 화면 넘김과 인쇄 펼치기가 함께 쓴다 */
  function syncPage(pg,depth,fx){
    pg.querySelectorAll('[data-step]').forEach(function(el){
      var k=+el.dataset.step; el.classList.toggle('step-hide',k>depth);
      if(fx&&k===depth) flag(el);
    });
    pg.querySelectorAll('[data-add]').forEach(function(el){
      var k=+el.dataset.add; el.classList.toggle('gone',k>depth); el.classList.toggle('new',k===depth&&depth>0);
    });
    pg.querySelectorAll('[data-only]').forEach(function(el){
      var k=+el.dataset.only; el.classList.toggle('gone',k!==depth);
      if(fx&&k===depth) flag(el);
    });
    pg.querySelectorAll('[data-until]').forEach(function(el){ el.classList.toggle('gone',depth>+el.dataset.until); });
    pg.querySelectorAll('[data-lit]').forEach(function(el){ el.classList.toggle('lit',+el.dataset.lit<=depth); });
  }
  /* 단계가 바뀌면 현재 장을 다시 칠하고 단계 점을 그린 뒤 deckstep 을 흘린다 */
  function emitStep(fx){
    syncPage(pages[pos],mark,fx);
    var top=topMark(pages[pos]), html='';
    for(var i=1;i<=top;i++) html+='<i class="'+(i<=mark?'on':'')+'"></i>';
    pips.innerHTML=html;
    document.dispatchEvent(new CustomEvent('deckstep',{detail:{slide:pos,step:mark}}));
  }
  function reflow(){
    var k=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    deckEl.style.transform='translate(-50%,-50%) scale('+k+')';
  }
  /* idx 장으로 간다. toEnd 면 그 장의 마지막 단계부터 시작(←로 돌아갈 때),
     instant 면 전환 연출 없이 바로 칠한다(deckGo·첫 표시) */
  function jumpTo(idx,toEnd,instant){
    deckEl.dataset.dir=(idx>pos)?'fwd':'back';
    pos=Math.max(0,Math.min(pages.length-1,idx));
    mark=toEnd?topMark(pages[pos]):0;
    function commit(){
      pages.forEach(function(pg,i){ pg.classList.toggle('active',i===pos); });
      emitStep(false);
      cellNum.textContent=(pos+1)+' / '+pages.length;
      rail.style.transform='scaleX('+((pos+1)/pages.length)+')';
      var memo=pages[pos].querySelector('.notes');
      memoBody.textContent=memo?memo.textContent:'';
      if(location.hash!=='#'+(pos+1)) history.replaceState(null,'','#'+(pos+1));
      document.dispatchEvent(new CustomEvent('deckslide',{detail:pos}));
    }
    /* 이미 켜진 장이 있을 때만 전환 연출을 태운다 — 첫 표시는 즉시 그린다 */
    if(window.eduMotion&&!instant&&deckEl.querySelector('.slide.active')) window.eduMotion.navigate(commit,deckEl.dataset.dir);
    else commit();
  }
  function advance(){ if(mark<topMark(pages[pos])){ mark++; emitStep(true); } else if(pos<pages.length-1){ jumpTo(pos+1,false); } }
  function retreat(){ if(mark>0){ mark--; emitStep(false); } else if(pos>0){ jumpTo(pos-1,true); } }
  /* 검사기·읽기 계층이 부르는 동기 점프: 전환 연출 없이 장·단계를 곧바로 맞춘다 */
  window.deckGo=function(i,st){
    jumpTo(i,false,true);
    var top=topMark(pages[pos]);
    mark=(st===undefined)?top:Math.max(0,Math.min(+st,top));
    emitStep(false);
  };
  window.deckInfo=function(){ return {slide:pos,step:mark,maxStep:topMark(pages[pos]),count:pages.length}; };
  function swapMemo(){ memoOn=!memoOn; memoBox.style.display=memoOn?'block':'none'; }
  function bigScreen(){
    var d=document;
    if(!d.fullscreenElement){ (d.documentElement.requestFullscreen||function(){}).call(d.documentElement); }
    else{ d.exitFullscreen(); }
  }

  /* ---- 입력: 편집 칸·링크·버튼·위젯 위에서는 장 넘김 키를 받지 않는다 ---- */
  var KEY_GUARD='a[href],button,input,textarea,select,summary,.code,.tabs,.faq,.pin-shot,.pin-list';
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(t&&(t.isContentEditable||(t.closest&&t.closest(KEY_GUARD)))) return;
    var k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){ e.preventDefault(); advance(); }
    else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); retreat(); }
    else if(k==='Home'){ jumpTo(0,false); }
    else if(k==='End'){ jumpTo(pages.length-1,false); }
    else if(k==='f'||k==='F'||k==='ㄹ'){ bigScreen(); }
    else if(k==='n'||k==='N'||k==='ㅜ'){ swapMemo(); }
  });
  var CLICK_GUARD='a,button,.todo,.chk,.code,.tabs,.faq,.pin-shot,.pin-list,.st-panel,.st-modal,.st-print,.expl,.dsheet';
  document.addEventListener('click',function(e){
    if(rootEl.classList.contains('ed-compact')) return;
    if(memoBox.contains(e.target)) return;
    /* 참고 자료 링크·체크리스트 칸·확인 문제·자습 창을 누른 클릭은 장을 넘기지 않는다 */
    if(e.target.closest&&e.target.closest(CLICK_GUARD)) return;
    if(e.clientX<window.innerWidth/3) retreat(); else advance();
  });
  var drag=null;
  document.addEventListener('touchstart',function(e){ drag=e.touches[0].clientX; },{passive:true});
  document.addEventListener('touchend',function(e){
    if(rootEl.classList.contains('ed-compact')){ drag=null; return; }
    if(drag===null) return;
    var dx=e.changedTouches[0].clientX-drag;
    if(Math.abs(dx)>50){ if(dx<0) advance(); else retreat(); }
    drag=null;
  });

  /* 인쇄할 때는 모든 장을 마지막 단계로 펼치고, 끝나면 현재 화면 상태로 되돌린다 */
  window.addEventListener('beforeprint',function(){ pages.forEach(function(pg){ syncPage(pg,topMark(pg),false); }); });
  window.addEventListener('afterprint',function(){ emitStep(false); });
  /* beforeprint 를 보내지 않는 환경(헤드리스 인쇄 미디어 에뮬레이션 등)도 같은 펼침을 보장한다 */
  var printQ=window.matchMedia?window.matchMedia('print'):null;
  if(printQ&&printQ.addEventListener)printQ.addEventListener('change',function(e){
    if(e.matches)pages.forEach(function(pg){ syncPage(pg,topMark(pg),false); });
    else emitStep(false);
  });
  window.addEventListener('resize',reflow);
  reflow();
  var first=parseInt((location.hash||'').slice(1),10);
  jumpTo(isNaN(first)?0:first-1,false);
  /* 열린 채로 주소 끝 #N 만 바꿔도 그 장으로 간다. jumpTo 의 replaceState 는
     hashchange 를 울리지 않으므로 되돌이가 없다 */
  window.addEventListener('hashchange',function(){
    var n=parseInt((location.hash||'').slice(1),10);
    if(!isNaN(n)&&n-1!==pos) jumpTo(n-1,false);
  });
  setTimeout(function(){ document.getElementById('help').style.opacity='0'; },4000);
  rootEl.classList.add('ed-ready');
}catch(err){ rootEl.classList.add('ed-fail'); throw err; }
})();
</script>

<script>
/* 체크리스트(.todo): 누르면 완료 표시를 켜고 끈다. 이 클릭이 장 넘김으로 번지지 않게 여기서 막는다. */
[].slice.call(document.querySelectorAll('.todo')).forEach(function(box){
  box.addEventListener('click',function(e){ e.stopPropagation(); box.classList.toggle('done'); });
});
</script>
<script>
/*
  도구 층: 자동 발표(A) · 화면 편집(E)
  [자동 발표] A 키로 시작·정지. 현재 장의 남은 단계를 한 단계씩 전부 공개한 뒤
    그 장의 data-sec 초(없으면 6초)만큼 머물고 다음 장으로 간다. 마지막 장이면 끝.
    아무 키 입력으로 정지한다. T·R 타이머와는 독립이고 deckGo 로 움직이므로
    발표자 보기(?presenter) 동기에는 그대로 실린다. 인쇄·reduced-motion 에는 영향 없음.
  [편집] E 키로 켜고 끈다. 제목·문단·표 칸·목록 같은 글자 요소만 contenteditable —
    상호작용 요소(.chk·.todo·버튼·링크·노트·자습·시트 패널)는 제외하고 줄바꿈(Enter)은 막아
    요소를 새로 만들지 못한다(텍스트만). 수정본은 localStorage 'edeck-edit-<파일이름>' 에
    {"<장번호>-<순번>":innerHTML} 로 저장하고, 편집 표시줄의 "수정 초기화" 로 전부 되돌린다.
    인쇄·자습·발표자 보기는 수정된 DOM 을 그대로 읽으므로 자동 반영된다.
    편집을 켜면 자동 발표는 멈춘다(글자 고치는 중 장이 넘어가지 않게).
*/
(function(){
var doc=document,root=doc.documentElement,body=doc.body;
function slides(){return [].slice.call(doc.querySelectorAll('#stage>.slide'));}

/* ---- 자동 발표 ---- */
var autoTimer=null,autoOn=false;
function autoStop(){autoOn=false;if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}root.classList.remove('ed-auto');}
function autoStep(){
  if(!autoOn)return;
  var info=window.deckInfo?deckInfo():null;
  if(!info){autoStop();return;}
  var pg=slides()[info.slide];
  if(info.step<info.maxStep){deckGo(info.slide,info.step+1);autoTimer=setTimeout(autoStep,800);return;}
  var sec=parseFloat(pg&&pg.getAttribute('data-sec'))||6;
  sec=Math.max(2,sec);
  autoTimer=setTimeout(function(){
    if(!autoOn)return;
    var i2=window.deckInfo?deckInfo():null;
    if(i2&&i2.slide<i2.count-1){deckGo(i2.slide+1,0);autoTimer=setTimeout(autoStep,700);}
    else autoStop();
  },sec*1000);
}
function autoStart(){if(autoOn)return;autoOn=true;root.classList.add('ed-auto');autoTimer=setTimeout(autoStep,700);}
window.eduAuto={start:autoStart,stop:autoStop,on:function(){return autoOn;}};

/* ---- 화면 편집 ---- */
var EDIT_SEL='.slide h1,.slide h2,.slide h3,.slide h4,.slide p,.slide li,.slide td,.slide th,.slide figcaption,.slide summary';
var EDIT_EXCL='.chk,.todo,button,a,aside,.st-panel,.st-modal,.st-print,.st-toast,.dsheet-panel,script,style';
var EKEY='edeck-edit-'+(decodeURIComponent(location.pathname.split('/').pop())||'deck');
var editOn=false,orig=new Map(),saveT=null,editBar=null;
function editables(){return [].slice.call(doc.querySelectorAll(EDIT_SEL)).filter(function(el){return !el.closest(EDIT_EXCL);});}
function editSave(){
  var o={};
  orig.forEach(function(html,el){if(el.innerHTML!==html){var k=el.getAttribute('data-ed');if(k)o[k]=el.innerHTML;}});
  try{localStorage.setItem(EKEY,JSON.stringify(o));}catch(e){}
}
function editReset(){
  try{localStorage.removeItem(EKEY);}catch(e){}
  orig.forEach(function(html,el){el.innerHTML=html;});
}
function editToggle(){
  editOn=!editOn;body.classList.toggle('ed-edit',editOn);
  editables().forEach(function(el){if(editOn)el.setAttribute('contenteditable','true');else el.removeAttribute('contenteditable');});
  if(editBar)editBar.hidden=!editOn;
  if(editOn)autoStop();else editSave();
}
doc.addEventListener('input',function(e){
  if(!editOn)return;
  var t=e.target;
  if(!t||!t.getAttribute||!t.getAttribute('data-ed'))return;
  if(saveT)clearTimeout(saveT);saveT=setTimeout(editSave,400);
});
doc.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))){
    if(t.isContentEditable&&e.key==='Enter'&&!e.isComposing)e.preventDefault();
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  var k=e.key;
  if(k==='a'||k==='A'||k==='ㅁ'){if(autoOn)autoStop();else autoStart();}
  else if(k==='e'||k==='E'||k==='ㄷ'){editToggle();}
  else if(autoOn)autoStop();
});
(function init(){
  var tag=doc.createElement('div');tag.id='edAuto';tag.textContent='자동 발표 중 — 아무 키로 정지';body.appendChild(tag);
  var bar=doc.createElement('div');bar.id='edEdit';bar.hidden=true;
  bar.innerHTML='<span>편집 중 — 글자를 바로 고칩니다 (E 종료)</span><button type="button" class="ed-reset">수정 초기화</button>';
  bar.querySelector('.ed-reset').addEventListener('click',function(){editReset();if(window.edToast)edToast('수정을 모두 되돌렸습니다');});
  editBar=bar;body.appendChild(bar);
  var order={};
  editables().forEach(function(el){
    var s=el.closest('.slide'),si=slides().indexOf(s),n=(order[si]=(order[si]||0)+1);
    el.setAttribute('data-ed',si+'-'+n);orig.set(el,el.innerHTML);
  });
  try{var o=JSON.parse(localStorage.getItem(EKEY)||'{}');}catch(e){return;}
  Object.keys(o).forEach(function(k){var el=doc.querySelector('[data-ed="'+k+'"]');if(el)el.innerHTML=o[k];});
})();
})();
</script>
</body>
