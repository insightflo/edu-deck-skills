<!doctype html>
<!--
  edu-deck-solo 셸 (assets/shell.html)
  [파일 목적] 모든 교육 덱이 함께 쓰는 뼈대. 핵심 CSS(디자인 토큰, 기본 클래스, 모형 창, 단계 등장),
    발표 엔진 JS, 화면 크롬(진행 막대, 단계 점, 쪽수, 도움말, 발표자 노트 창)을 담는다.
  [주요 흐름] scripts/build_deck.py가 이 파일을 읽어 표식 5곳을 채운다.
    제목 표식(TITLE, 중괄호 두 겹) ← deck.json 의 title
    추가 CSS 표식(EXTRA_CSS 주석) ← assets/css/*.css + 덱 src/*.css
    아이콘 표식(ICONS 주석) ← assets/icons/*.svg + 덱 src/*.svg 의 symbol·marker
    슬라이드 표식(SLIDES 주석) ← 덱 src/*.html 조각 (파일 이름순)
    자습 데이터 표식(STUDY_DATA 주석) ← deck.json 의 선택 키 summary/glossary (window.EDU_STUDY, 없으면 빈 칸)
  [외부 연결] 클래스 사용법은 references/classes.md, 검사 기준은 scripts/check_deck.py.
  [수정시 주의] 표식 문자열을 바꾸거나 이 주석에 그대로 적으면 빌드가 깨진다.
    단계 속성(data-step/add/only/lit/until)과 상태 클래스(active, step-hide, gone, pop, lit, new, thinking)는
    모든 조각과 check_deck.py가 기대하는 계약이다. 바꾸면 classes.md와 check_deck.py도 함께 고친다.
-->
<html lang="ko" class="ed-deck">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 엔진 준비 표시: ed-js=스크립트 동작, ed-ready=엔진 초기화 완료, ed-fail=실패/3초 초과.
   실패하면 viewer.css 가 모든 슬라이드를 폭에 맞춰 이어서 보여 준다. */
document.documentElement.classList.add('ed-js');
window.addEventListener('error',function(e){var h=document.documentElement;if(h.classList.contains('ed-ready'))return;if(e&&/ResizeObserver/.test(String(e.message||e)))return;h.classList.add('ed-fail');},true);
setTimeout(function(){var h=document.documentElement;if(!h.classList.contains('ed-ready'))h.classList.add('ed-fail');},3000);
</script>
<title>{{TITLE}}</title>
<style>
/*CORE_CSS*/
/*COMMON_CSS*/
</style>
<style>
/* ---------- 셸 보강: 토큰 ---------- */


/* ---------- 셸 보강: 읽기 쉬움 (참고 덱보다 대비·최소 글자를 조금 올림, 모양은 그대로) ---------- */
.mk,.input .send{background:var(--accent-deep)}
.av{font-size:20px}
.side .sec{font-size:20px;color:var(--soft)}
.input .ph{color:var(--soft)}
/* 어두운·주황 바탕 위 카드: 밝은 글자색을 물려받아 종이색 카드 위에서 안 보이는 것(대비 1.1~1.7)을 막는다 */
.card{color:var(--ink)}
.dark .card .body,.dark .card .small{color:var(--soft)}
.orange .body,.orange .small{color:var(--ink)}
/* 단계 등장 효과는 translate 속성으로 움직인다. transform 을 쓰면 요소 자체의 transform
   (도장 기울기, 대화상자 가운데 맞춤, SVG <g transform>)을 0.45초 동안 덮어써 모양·자리가 틀어진다 */

/* 글꼴 순서: macOS 에서 Office 가 깔린 맑은 고딕보다 Apple SD Gothic Neo 를 먼저 쓴다(Windows 는 그대로 맑은 고딕) */

/* ---------- 자습 레이어(S 자습 모드 · P 인쇄 · G 용어집)와 확인 문제(.chk) ---------- */

@media print{
  body.st-printing{background:var(--paper) !important;overflow:visible !important;height:auto !important;width:auto !important}
  html:has(body.st-printing){overflow:visible !important;height:auto !important;width:auto !important;background:var(--paper) !important}
  body.st-printing>*:not(#st-print){display:none !important}
  body.st-printing #st-print{position:static;display:block;background:none;width:auto;height:auto}
  body.st-printing .st-prbar{display:none}
  body.st-printing .st-prscroll{overflow:visible;padding:0}
  body.st-printing .st-paper{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
}
/* 확인 문제(.chk): 보기를 눌러 답하고, 틀리면 해설 + 지정 장 다시 보기 */
.chk{display:flex;flex-direction:column;gap:16px;background:var(--paper);border:2px solid var(--accent-light);border-radius:var(--r3);padding:32px 32px;box-shadow:var(--shadow-2)}
.chk-q{font-size:34px;font-weight:700;line-height:1.4;color:var(--ink)}
.chk-q .chk-n{display:inline-block;min-width:44px;margin-right:16px;padding:0px 16px;border-radius:var(--r3);background:var(--accent-deep);color:var(--paper);font-size:24px;text-align:center;vertical-align:4px}
.chk-opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chk-o{font-family:inherit;font-size:27px;line-height:1.35;text-align:left;color:var(--ink);background:var(--paper);border:2px solid var(--accent-light);border-radius:var(--r2);padding:16px 16px;cursor:pointer;}
.chk-o:hover:not(:disabled){border-color:var(--accent);background:var(--paper)}
.chk-o:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.chk-o:disabled{cursor:default}
.chk-done .chk-o:not(.chk-right):not(.chk-picked){opacity:.45}
.chk-o.chk-right{border-color:var(--success);background:var(--light);font-weight:700}
.chk-o.chk-right::before{content:"정답 ";color:var(--success);font-weight:700}
.chk-o.chk-picked:not(.chk-right){border-color:var(--danger);background:var(--paper)}
.chk-o.chk-picked:not(.chk-right)::before{content:"고른 답 ";color:var(--danger);font-weight:700}
.chk-why{display:none}
.chk-fb{display:none;flex-wrap:wrap;align-items:center;gap:16px 16px;border-radius:var(--r2);padding:16px 16px}
.chk-done .chk-fb{display:flex}
.chk-ok .chk-fb{background:var(--light)}
.chk-ng .chk-fb{background:var(--paper)}
.chk-msg{flex:1 1 100%;font-size:26px;font-weight:700}
.chk-ok .chk-msg{color:var(--success)}
.chk-ng .chk-msg{color:var(--danger)}
.chk-fb .chk-why{display:block;flex:1 1 100%;font-size:25px;line-height:1.5;color:var(--soft)}
.chk-go,.chk-again{font-family:inherit;font-size:23px;font-weight:700;border-radius:var(--r2);padding:8px 16px;cursor:pointer}
.chk-go{color:var(--paper);background:var(--ink);border:none}
.chk-ok .chk-go{background:var(--paper);color:var(--ink);border:2px solid var(--blue-soft)}
.chk-again{color:var(--soft);background:transparent;border:2px solid var(--accent-light)}
.chk-back{position:fixed;left:24px;bottom:64px;z-index:9;font:700 17px/1 'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--paper);background:var(--accent);border:none;border-radius:var(--r3);padding:16px 16px;box-shadow:var(--shadow-1);cursor:pointer}
.chk-back[hidden]{display:none}

/* ---------- 움직임 줄이기 설정 존중 ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{}
}

/* ---------- 모션 층: 장·요소 등장 리듬 (iart-ai/motion-skills 기법 이식 — CSS 전용, 틀만 변화)
   규칙: ① transform·opacity만 움직인다(60fps) ② 등장은 ease-out(--eo), 되돌아갈 때는 반대 방향 ③ 
   prefers-reduced-motion 에서는 전부 꺼진다(검사기 2차 패스·움직임 줄이기 설정과 같은 조건) ④ 
   애니메이션은 모두 자연 상태로 끝나므로 인쇄·검사의 안정 상태가 바뀌지 않는다. ---------- */
@media (prefers-reduced-motion: no-preference){
  
  /* 장 등장: 앞으로 넘길 때 아래에서, 뒤로 돌아갈 때 위에서 */
  .slide.active{}
  #stage[data-dir="back"] .slide.active{}
  /* 장 안 공통 요소: 머리(eyebrow→제목)와 칸·줄들이 60ms 간격으로 차례 등장 */
  .slide.active>.head{}
  .slide.active>.head .eyebrow{}
  .slide.active .card,.slide.active .rm-col,.slide.active .todo,.slide.active .qrow,
  .slide.active .lv,.slide.active .pill,.slide.active .tile{}
  .slide.active .card:nth-child(1),.slide.active .rm-col:nth-child(2),.slide.active .todo:nth-child(1),
  .slide.active .qrow:nth-child(1),.slide.active .lv:nth-child(2),.slide.active .pill:nth-child(1),
  .slide.active .tile:nth-child(1){}
  .slide.active .card:nth-child(2),.slide.active .rm-col:nth-child(3),.slide.active .todo:nth-child(2),
  .slide.active .qrow:nth-child(2),.slide.active .lv:nth-child(3),.slide.active .pill:nth-child(2),
  .slide.active .tile:nth-child(2){}
  .slide.active .card:nth-child(3),.slide.active .rm-col:nth-child(4),.slide.active .todo:nth-child(3),
  .slide.active .qrow:nth-child(3),.slide.active .lv:nth-child(4),.slide.active .pill:nth-child(3),
  .slide.active .tile:nth-child(3){}
  .slide.active .card:nth-child(4),.slide.active .rm-col:nth-child(5),.slide.active .todo:nth-child(4),
  .slide.active .qrow:nth-child(4),.slide.active .pill:nth-child(4),.slide.active .tile:nth-child(4){}
  .slide.active .card:nth-child(5),.slide.active .rm-col:nth-child(6),.slide.active .pill:nth-child(5){}
  .slide.active .card:nth-child(6),.slide.active .rm-col:nth-child(7){}
  /* 핵심 문장장(statement·closing): 큰 글자가 늦게 뜨고 알약이 따라온다 */
  .slide.active>.eyebrow{}
  .slide.active>.big{}
  /* 표지: 제목 라인이 마스크 위로 올라온다 */
  .slide.active .cx-eyebrow{}
  .slide.active .cx-title{}
  /* 단계 등장(.pop): 되튕김 이징으로 고친다(포트 규칙보다 뒤에 와 이긴다) */
  .pop{}
  /* 진행 막대: 너비 대신 scaleX(변환만) — 엔진이 scaleX 값을 넣는다 */
  #progress{transition:opacity var(--m2) var(--e-out),transform var(--m2) var(--e-out);}
  /* 단계 점: 켜지는 점이 한 번 부풀었다가 잦아든다 */
  #dots i.on{}
}






/* 진행 막대 기본 상태(게이트 밖): 엔진이 scaleX 로 채운다. 움직임 줄이기에서도 값은 같이 간다 */
#progress{transform-origin:0 50%;transform:scaleX(0)}

/* ---------- 인쇄: 한 쪽에 한 슬라이드, 모든 단계를 펼친 상태 ---------- */
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{width:1920px;height:auto;overflow:visible;background:var(--paper)}
  #stage{position:static;transform:none !important;width:1920px;height:auto}
  .slide{position:relative;display:flex !important;break-after:page;page-break-after:always}
  .step-hide{visibility:visible !important}
  #progress,#dots,#counter,#help,#notes{display:none !important}
  /* 인쇄 창에서 '배경 그래픽'을 꺼도 어두운·주황 바탕과 칩 색을 남긴다 */
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  /* 표지를 한 번도 열지 않고 인쇄하면 등장 애니메이션 전 상태(투명)로 찍히므로 바로 보이게 한다 */
  .cx-tokens span,.cx-sub,.cx-badge{opacity:1 !important;transform:none !important;}
  /* 모션 층도 인쇄에서는 끈다(장·칸 등장 애니메이션이 인쇄 지연·중간 상태를 만들지 않게) */
  .slide.active,.card,.rm-col,.todo,.qrow,.lv,.pill,.tile,#dots i.on{}
}

<p class="ed-nojs">브라우저에서 열면 넘기기·자습이 동작합니다</p>
<!--STUDY_DATA-->
<div id="stage">
<!--ICONS-->
<!--SLIDES-->
</div>

<div id="progress"></div>
<div id="dots"></div>
<div id="counter"></div>
<div id="help">→ 다음 (한 단계씩) · ← 이전 · F 전체화면 · N 발표자 노트 · S 자습 · P 인쇄 · G 용어집</div>
<div id="notes"><div class="h">발표자 노트 (N으로 닫기)</div><div id="notesText"></div></div>

<script>/*MOTION_JS*/</script>
<script>
/*
  발표 엔진
  [목적] 1920×1080 무대를 창 크기에 맞춰 축소하고, 슬라이드 이동과 슬라이드 안의 단계 등장을 처리한다.
  [입력] #stage 바로 아래 section.slide 들과 그 안의 단계 속성, aside.notes.
    data-step=k  k단계부터 보임(그 단계에서 튀어나오는 효과, AI 말풍선 .a 는 생각 중 점 표시 후 등장)
    data-add=k   k단계부터 보이고 k단계에서만 .new 강조(덧붙인 문구 표시)
    data-only=k  k단계에서만 보임(상태 바꾸기: 전→후, 질문→답)
    data-lit=k   k단계부터 .lit 클래스(정답·1등 막대 강조)
    data-until=k k단계까지만 보임
  [출력] .active/.step-hide/.gone/.new/.lit 클래스 토글, 진행 막대·단계 점·쪽수, 주소 #N, deckslide·deckstep 이벤트.
  [연결] window.deckGo(i, step) 와 window.deckInfo() 는 scripts/check_deck.py 가 렌더 검사에 쓴다.
  [수정시 주의] 속성 이름·클래스 이름을 바꾸면 모든 슬라이드 조각과 검사 스크립트가 함께 깨진다.
*/
(function(){try{
  var stage=document.getElementById('stage');
  var slides=[].slice.call(document.querySelectorAll('#stage > .slide'));
  var counter=document.getElementById('counter');
  var progress=document.getElementById('progress');
  var dots=document.getElementById('dots');
  var notesBox=document.getElementById('notes');
  var notesText=document.getElementById('notesText');
  var cur=0, step=0, notesOn=false;
  var ATTRS=['step','add','only','lit','until'];
  var SEL='[data-step],[data-add],[data-only],[data-lit],[data-until]';
  if(!slides.length) return;

  function maxStep(s){
    var m=0;
    s.querySelectorAll(SEL).forEach(function(e){
      ATTRS.forEach(function(a){ if(e.dataset[a]!==undefined) m=Math.max(m,+e.dataset[a]); });
    });
    return m;
  }
  function reveal(e){
    e.classList.add('pop'); // Shared motion engine observes the semantic step event.
  }
  // 한 슬라이드를 n단계 상태로 그린다. 화면 표시와 인쇄 준비가 함께 쓴다.
  function paint(s,n,animate){
    s.querySelectorAll('[data-step]').forEach(function(e){
      var k=+e.dataset.step; e.classList.toggle('step-hide',k>n);
      if(animate&&k===n) reveal(e);
    });
    s.querySelectorAll('[data-add]').forEach(function(e){
      var k=+e.dataset.add; e.classList.toggle('gone',k>n); e.classList.toggle('new',k===n&&n>0);
    });
    s.querySelectorAll('[data-only]').forEach(function(e){
      var k=+e.dataset.only; e.classList.toggle('gone',k!==n);
      if(animate&&k===n) reveal(e);
    });
    s.querySelectorAll('[data-until]').forEach(function(e){ e.classList.toggle('gone',n>+e.dataset.until); });
    s.querySelectorAll('[data-lit]').forEach(function(e){ e.classList.toggle('lit',+e.dataset.lit<=n); });
  }
  // 단계가 바뀔 때마다 deckstep 을 알린다(채점 크레파스 모션이 단계 공개에 맞춰 그려지게. deckslide 와 같은 형식)
  function apply(animate){
    paint(slides[cur],step,animate);
    var m=maxStep(slides[cur]), h='';
    for(var i=1;i<=m;i++) h+='<i class="'+(i<=step?'on':'')+'"></i>';
    dots.innerHTML=h;
    document.dispatchEvent(new CustomEvent('deckstep',{detail:{slide:cur,step:step}}));
  }
  function fit(){
    var sc=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform='translate(-50%,-50%) scale('+sc+')';
  }
  function show(i,atEnd,immediate){
    stage.dataset.dir=(i>cur)?'fwd':'back';
    cur=Math.max(0,Math.min(slides.length-1,i));
    step=atEnd?maxStep(slides[cur]):0;
    function render(){
    slides.forEach(function(el,k){el.classList.toggle('active',k===cur);});
    apply(false);
    counter.textContent=(cur+1)+' / '+slides.length;
    progress.style.transform='scaleX('+((cur+1)/slides.length)+')';
    var n=slides[cur].querySelector('.notes');
    notesText.textContent=n?n.textContent:'';
    if(location.hash!=='#'+(cur+1)) history.replaceState(null,'','#'+(cur+1));
    document.dispatchEvent(new CustomEvent('deckslide',{detail:cur}));
    }
    if(window.eduMotion&&!immediate&&stage.querySelector('.slide.active')) window.eduMotion.navigate(render,stage.dataset.dir);
    else render();
  }
  function next(){ if(step<maxStep(slides[cur])){step++;apply(true);} else if(cur<slides.length-1){show(cur+1,false);} }
  function prev(){ if(step>0){step--;apply(false);} else if(cur>0){show(cur-1,true);} }
  window.deckGo=function(i,st){
    show(i,false,true); // deckGo is deliberately synchronous for checkers and callers.
    var m=maxStep(slides[cur]);
    step=(st===undefined)?m:Math.max(0,Math.min(+st,m));
    apply(false);
  };
  window.deckInfo=function(){ return {slide:cur, step:step, maxStep:maxStep(slides[cur]), count:slides.length}; };
  function toggleNotes(){notesOn=!notesOn;notesBox.style.display=notesOn?'block':'none';}
  function fullscreen(){
    var d=document;
    if(!d.fullscreenElement){(d.documentElement.requestFullscreen||function(){}).call(d.documentElement);}
    else{d.exitFullscreen();}
  }
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(t&&(t.isContentEditable||(t.closest&&t.closest('a[href],button,input,textarea,select,summary,.code,.tabs,.faq,.pin-shot,.pin-list')))) return;
    var k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
    else if(k==='Home'){show(0,false);}
    else if(k==='End'){show(slides.length-1,false);}
    else if(k==='f'||k==='F'||k==='ㄹ'){fullscreen();}
    else if(k==='n'||k==='N'||k==='ㅜ'){toggleNotes();}
  });
  document.addEventListener('click',function(e){
    if(document.documentElement.classList.contains('ed-compact')) return;
    if(notesBox.contains(e.target)) return;
    // 참고 자료 링크·체크리스트 칸·확인 문제·자습 창을 누를 때는 슬라이드를 넘기지 않는다
    if(e.target.closest&&e.target.closest('a,button,.todo,.chk,.code,.tabs,.faq,.pin-shot,.pin-list,.st-panel,.st-modal,.st-print')) return;
    if(e.clientX<window.innerWidth/3) prev(); else next();
  });
  var tx=null;
  document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend',function(e){
    if(document.documentElement.classList.contains('ed-compact')){tx=null;return;}
    if(tx===null) return; var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>50){ if(dx<0) next(); else prev(); } tx=null;
  });
  // 인쇄할 때는 모든 슬라이드를 마지막 단계로 펼치고, 끝나면 현재 화면 상태로 되돌린다
  window.addEventListener('beforeprint',function(){ slides.forEach(function(s){ paint(s,maxStep(s),false); }); });
  window.addEventListener('afterprint',function(){ apply(false); });
  window.addEventListener('resize',fit);
  fit();
  var start=parseInt((location.hash||'').slice(1),10);
  show(isNaN(start)?0:start-1,false);
  // 열린 채로 주소 끝 #N 만 바꿔도 그 장으로 간다. show() 의 replaceState 는 hashchange 를 부르지 않아 되돌이가 없다
  window.addEventListener('hashchange',function(){
    var n=parseInt((location.hash||'').slice(1),10);
    if(!isNaN(n)&&n-1!==cur) show(n-1,false);
  });
  setTimeout(function(){document.getElementById('help').style.opacity='0';},4000);
  document.documentElement.classList.add('ed-ready');
}catch(err){document.documentElement.classList.add('ed-fail');throw err;}
})();
</script>

<script>
/* 체크리스트(.todo): 누르면 완료 표시가 켜지고 꺼진다. 슬라이드 넘김 클릭으로 번지지 않게 막는다. */
document.querySelectorAll('.todo').forEach(function(el){
  el.addEventListener('click',function(e){ e.stopPropagation(); el.classList.toggle('done'); });
});
