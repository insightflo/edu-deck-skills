<!doctype html>
<!-- Independent resource-pack shell. Generated by dev/port.py from the same packaged
     sources as shell.html (templates + css/js/fonts) — fix runtime sources and regenerate
     both shells instead of hand-syncing. No legacy visual assets. -->
<html lang="ko" class="ed-deck"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 엔진 준비 표시: ed-js=스크립트 동작, ed-ready=엔진 초기화 완료, ed-fail=실패/3초 초과. */
var deckRoot=document.documentElement;
deckRoot.classList.add('ed-js');
window.addEventListener('error',function(ev){
  if(deckRoot.classList.contains('ed-ready'))return;
  if(!ev||!ev.message)return;   // <img> 등 리소스 로딩 실패는 엔진 실패가 아니다
  var text=String(ev.message);
  if(/ResizeObserver/.test(text))return;
  deckRoot.classList.add('ed-fail');
},true);
setTimeout(function(){ if(!deckRoot.classList.contains('ed-ready'))deckRoot.classList.add('ed-fail'); },3000);
</script>
<title>{{TITLE}}</title><style>/*COMMON_CSS*/</style><style>
/* ---------- 도구 층: 자동 발표 표시 · 편집 표시줄 · 탐색 위젯 · 사이드 시트 · 차트 ---------- */
#edAuto{position:fixed;right:28px;bottom:72px;z-index:9;display:none;background:var(--accent);color:var(--paper);font:700 17px/1 'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:10px 16px;border-radius:var(--r2);box-shadow:var(--shadow-1)}

body.ed-edit #edEdit{display:flex}
#edEdit .ed-reset{font:inherit;font-size:15px;font-weight:700;color:var(--paper);background:var(--accent);border:none;border-radius:var(--r1);padding:6px 14px;cursor:pointer}
body.ed-edit .slide [data-ed]{cursor:text}
body.ed-edit .slide [data-ed]:hover{outline:2px dashed var(--accent-light);outline-offset:3px}
body.ed-edit .slide [data-ed]:focus{outline:2px solid var(--accent);outline-offset:3px}

/* 탐색 위젯(.expl): 칩으로 연결 상태를 바꾼다. 채점 없음 — 인쇄·자습에서는 모든 상태가 펼쳐진다 */

.expl-chip{font:inherit;font-size:22px;font-weight:700;color:var(--soft);background:var(--paper);border:2px solid var(--accent-light);border-radius:999px;padding:8px 22px;cursor:pointer}
.expl-chip:hover{border-color:var(--accent)}

.expl-state.on{display:flex}
.expl-cap{font-size:20px;font-weight:700;color:var(--accent-text)}

/* 사이드 시트(.dsheet): 본문 칩이 하단 시트를 올린다. 무대(#stage) 좌표계 안에서 고정 — 주변은 dim 으로 어둡게(blur 없음) */

.dsheet-panel{position:fixed;left:50%;bottom:0;z-index:7;width:min(1560px,88%);max-height:64%;overflow:auto;background:var(--paper);border-radius:var(--r2) var(--r2) 0 0;border-top:6px solid var(--accent);box-shadow:var(--shadow-2);padding:28px 36px;display:flex;flex-direction:column;gap:14px;transform:translate(-50%,110%);visibility:hidden;transition:transform var(--m3) var(--e-out),visibility 0s var(--m3)}

/* 미니 흐름(.vflow·.vnode·.varr·.vpills): 카드·본문 안 한 줄/한 줄기 "A → B → C" 인라인 흐름 어휘.
   fig-slot 보다 작은 카드 단위 층 — 도식 문법(svg.dg)이 아니라 HTML 인라인. 독자 등장 모션은 없고

/* 2×2 사분면(.quad): 두 축(.qax-x 위 · .qax-y 왼쪽 세로쓰기)이 만나는 네 영역 배치.
   칸 목록은 .qgrid>.qcell, 좌표 배치는 .qplot(십자 축선 상대 판) 안 절대 위치 칩(.qp)·거품(.qbub).
   .qp/.qbub 은 CSS translate 속성으로 중심을 맞추므로 계열 시그니처의 transform 프레임과 겹치지 않는다.
   독자 모션 없음 — 장 계열 시그니처·data-step 을 따른다. 축 라벨은 측정값이 아니라 개념 기준이다 */
.quad{display:grid;grid-template-areas:". ax" "ay qg";grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:10px 20px;flex:1;min-height:0}
.qax{display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:800;color:var(--soft);white-space:nowrap}
.qax-x{grid-area:ax}
.qax-y{grid-area:ay;writing-mode:vertical-rl}
.qgrid{grid-area:qg;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;min-height:0}

.qplot{grid-area:qg;position:relative;border:3px solid var(--line);border-radius:var(--r2);min-height:0}
.qplot::before,.qplot::after{content:"";position:absolute;background:var(--line)}
.qplot::before{left:0;right:0;top:50%;height:2px}
.qplot::after{top:0;bottom:0;left:50%;width:2px}
.qp{position:absolute;translate:-50% -50%}
.qbub{position:absolute;translate:-50% -50%;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;background:var(--accent-soft);border:3px solid var(--accent);color:var(--ink);font-size:22px;font-weight:800}
.dark .qbub{background:var(--light);border-color:var(--accent-light)}
/* 플래시카드(.fcards>.fc): 앞면 .fc-front·뒷면 .fc-back. 화면에서 카드를 누르면 .on 토글로 뒤집는다

.fcards{display:grid;gap:20px;flex:1;min-height:0}
.fc{font:inherit;color:inherit;text-align:inherit;background:none;border:0;padding:0;position:relative;min-height:0;perspective:1200px;cursor:pointer}
.fc-in{position:absolute;inset:0;display:block;transform-style:preserve-3d;transition:transform var(--m3) var(--e-out)}
.fc-front,.fc-back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;border-radius:var(--r2);border:3px solid var(--line);background:var(--paper);color:var(--ink);backface-visibility:hidden}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}

.fc.on .fc-in{transform:rotateY(180deg)}
.fc-no{position:absolute;top:12px;left:18px;font-size:20px;font-weight:800;color:var(--soft)}
.fc.cut .fc-front,.fc.cut .fc-back{border-style:dashed;border-color:var(--muted)}
.fc.open{cursor:default}
.fc.open .fc-in{position:static;transform:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;height:100%;transform-style:flat}
.fc.open .fc-front,.fc.open .fc-back{position:static;transform:none;backface-visibility:visible}

<script>/*MOTION_JS*/</script>
<script>
/*
  발표 엔진 (클린룸 재구현 — 계약은 그대로, 구현은 새로)
  [목적] 1920×1080 무대를 창 크기에 맞춰 줄이고, 장 넘김과 장 안의 단계 공개를 관리한다.
  [입력] #stage 직계 자식 section.slide 들과 그 안의 단계 속성, aside.notes.
    data-step=k  k단계부터 보임(그 단계에서 .pop 으로 튀어나옴, .a 말풍선은 점 표시 뒤 등장)
    data-add=k   k단계부터 보이고 그 단계에서만 .new 강조(덧붙인 문구 표시)
    data-only=k  k단계에서만 보임(전→후, 질문→답 상태 교체)
    data-lit=k   k단계부터 .lit 유지(정답·강조 칠하기)
    data-until=k k단계까지만 보임
  [출력] .active/.step-hide/.gone/.new/.lit 토글, 진행 막대·단계 점·쪽수, 주소 #N,
    deckstep(detail={slide,step})·deckslide(detail=장 번호) 이벤트.
  [연결] window.deckGo(i,step) 와 window.deckInfo() 는 검사기(scripts/check_deck.py)와
    읽기(responsive.js)·자습(study.js)·타이머(talk.js)·검색(viewer.js) 계층이 부른다.
  [수정시 주의] 속성·클래스·이벤트 이름과 deckstep→deckslide 발생 순서는 계약이다.
    바꾸면 슬라이드 조각·모션·읽기·검사 스크립트가 함께 깨진다.
*/
(function(){
var rootEl=document.documentElement;
try{
  var deckEl=document.getElementById('stage');
  var pages=deckEl?[].slice.call(deckEl.children).filter(function(el){return el.classList.contains('slide')}):[];
  if(!pages.length) return;
  var rail=document.getElementById('progress');
  var pips=document.getElementById('dots');
  var cellNum=document.getElementById('counter');
  var memoBox=document.getElementById('notes');
  var memoBody=document.getElementById('notesText');
  var pos=0, mark=0, memoOn=false;
  var MARKS=['step','add','only','lit','until'];
  var MARK_SEL='[data-'+MARKS.join('],[data-')+']';

  /* 장에 달린 단계 번호 중 가장 큰 값 */
  function topMark(pg){
    var top=0;
    pg.querySelectorAll(MARK_SEL).forEach(function(el){
      MARKS.forEach(function(k){ if(el.dataset[k]!==undefined) top=Math.max(top,+el.dataset[k]); });
    });
    return top;
  }
  /* 방금 열린 요소에 등장 표시. 실제 움직임은 공용 모션 계층이 deckstep 을 보고 그린다 */
  function flag(el){ el.classList.add('pop'); }
  /* 한 장을 depth 단계 상태로 만든다. 화면 넘김과 인쇄 펼치기가 함께 쓴다 */
  function syncPage(pg,depth,fx){
    pg.querySelectorAll('[data-step]').forEach(function(el){
      var k=+el.dataset.step; el.classList.toggle('step-hide',k>depth);
      if(fx&&k===depth) flag(el);
    });
    pg.querySelectorAll('[data-add]').forEach(function(el){
      var k=+el.dataset.add; el.classList.toggle('gone',k>depth); el.classList.toggle('new',k===depth&&depth>0);
    });
    pg.querySelectorAll('[data-only]').forEach(function(el){
      var k=+el.dataset.only; el.classList.toggle('gone',k!==depth);
      if(fx&&k===depth) flag(el);
    });
    pg.querySelectorAll('[data-until]').forEach(function(el){ el.classList.toggle('gone',depth>+el.dataset.until); });
    pg.querySelectorAll('[data-lit]').forEach(function(el){ el.classList.toggle('lit',+el.dataset.lit<=depth); });
  }
  /* 단계가 바뀌면 현재 장을 다시 칠하고 단계 점을 그린 뒤 deckstep 을 흘린다 */
  function emitStep(fx){
    syncPage(pages[pos],mark,fx);
    var top=topMark(pages[pos]), html='';
    for(var i=1;i<=top;i++) html+='<i class="'+(i<=mark?'on':'')+'"></i>';
    pips.innerHTML=html;
    document.dispatchEvent(new CustomEvent('deckstep',{detail:{slide:pos,step:mark}}));
  }
  function reflow(){
    var k=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    deckEl.style.transform='translate(-50%,-50%) scale('+k+')';
  }
  /* idx 장으로 간다. toEnd 면 그 장의 마지막 단계부터 시작(←로 돌아갈 때),
     instant 면 전환 연출 없이 바로 칠한다(deckGo·첫 표시) */
  function jumpTo(idx,toEnd,instant){
    cancelFinish();
    deckEl.dataset.dir=(idx>pos)?'fwd':'back';
    pos=Math.max(0,Math.min(pages.length-1,idx));
    mark=toEnd?topMark(pages[pos]):0;
    function commit(){
      pages.forEach(function(pg,i){ pg.classList.toggle('active',i===pos); });
      emitStep(false);
      cellNum.textContent=(pos+1)+' / '+pages.length;
      rail.style.transform='scaleX('+((pos+1)/pages.length)+')';
      var memo=pages[pos].querySelector('.notes');
      memoBody.textContent=memo?memo.textContent:'';
      if(location.hash!=='#'+(pos+1)) history.replaceState(null,'','#'+(pos+1));
      document.dispatchEvent(new CustomEvent('deckslide',{detail:pos}));
      /* 자동 완주(M): instant 아님 = 사용자 넘김·첫 로드 — 도착한 장의 남은 단계를 순차 재생한다.
         deckGo·검사기(instant)는 영향 없고, toEnd 진입(←로 돌아가기)은 이미 끝 단계라 무동작 */
      if(motionAuto&&!instant) autoFinish();
    }
    /* 이미 켜진 장이 있을 때만 전환 연출을 태운다 — 첫 표시는 즉시 그린다 */
    if(window.eduMotion&&!instant&&deckEl.querySelector('.slide.active')) window.eduMotion.navigate(commit,deckEl.dataset.dir);
    else commit();
  }
  function advance(){ cancelFinish(); if(mark<topMark(pages[pos])){ mark++; emitStep(true); } else if(pos<pages.length-1){ jumpTo(pos+1,false); } }
  function retreat(){ cancelFinish(); if(mark>0){ mark--; emitStep(false); } else if(pos>0){ jumpTo(pos-1,true); } }
  /* 검사기·읽기 계층이 부르는 동기 점프: 전환 연출 없이 장·단계를 곧바로 맞춘다 */
  window.deckGo=function(i,st){
    jumpTo(i,false,true);
    var top=topMark(pages[pos]);
    mark=(st===undefined)?top:Math.max(0,Math.min(+st,top));
    emitStep(false);
  };
  window.deckInfo=function(){ return {slide:pos,step:mark,maxStep:topMark(pages[pos]),count:pages.length}; };
  function swapMemo(){ memoOn=!memoOn; memoBox.style.display=memoOn?'block':'none'; }
  function bigScreen(){
    var d=document;
    if(!d.fullscreenElement){ (d.documentElement.requestFullscreen||function(){}).call(d.documentElement); }
    else{ d.exitFullscreen(); }
  }

  /* ---- 입력: 편집 칸·링크·버튼·위젯 위에서는 장 넘김 키를 받지 않는다 ---- */
  var KEY_GUARD='a[href],button,input,textarea,select,summary,.code,.tabs,.faq,.pin-shot,.pin-list';
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(t&&(t.isContentEditable||(t.closest&&t.closest(KEY_GUARD)))) return;
    var k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){ e.preventDefault(); advance(); }
    else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); retreat(); }
    else if(k==='Home'){ jumpTo(0,false); }
    else if(k==='End'){ jumpTo(pages.length-1,false); }
    else if(k==='f'||k==='F'||k==='ㄹ'){ bigScreen(); }
    else if(k==='n'||k==='N'||k==='ㅜ'){ swapMemo(); }
    else if(k==='g'||k==='G'||k==='ㅎ'){ e.preventDefault(); motionFinishKey(); }
    else if(k==='m'||k==='M'||k==='ㅡ'){ e.preventDefault(); motionModeSet(!motionAuto); }
  });
  var CLICK_GUARD='a,button,.todo,.chk,.code,.tabs,.faq,.pin-shot,.pin-list,.st-panel,.st-modal,.st-print,.expl,.dsheet';
  document.addEventListener('click',function(e){
    if(rootEl.classList.contains('ed-compact')) return;
    if(memoBox.contains(e.target)) return;
    /* 참고 자료 링크·체크리스트 칸·확인 문제·자습 창을 누른 클릭은 장을 넘기지 않는다 */
    if(e.target.closest&&e.target.closest(CLICK_GUARD)) return;
    if(e.clientX<window.innerWidth/3) retreat(); else advance();
  });
  /* 더블클릭: 현재 장의 남은 단계를 순차 재생해 끝까지 공개한다(장 이동 없음).
     dblclick 전에 click 이 먼저 단계를 넘기는 것은 감수한다 — click 반응을
     지연 큐로 늦추지 않는다. 이미 마지막 단계면 아무 일도 하지 않는다. */
  var finishTimer=null;
  function cancelFinish(){ if(finishTimer!==null){ clearTimeout(finishTimer); finishTimer=null; } }
  function staticNow(){
    var mq=window.matchMedia?window.matchMedia.bind(window):function(){return{matches:false};};
    return mq('(prefers-reduced-motion: reduce)').matches||mq('print').matches
      ||/st-(self|printing|presenter|sheet)/.test(document.body.className);
  }
  /* 스킵 점프가 아니라 단계 공개 경로를 재생 간격으로 연달아 호출한다 —
     남은 단계의 모션이 다 보인다. 전체 3초 상한 안에서 남은 수로 균등 분할. */
  function finishSteps(){
    cancelFinish();
    var top=topMark(pages[pos]);
    if(mark>=top) return;
    if(staticNow()){ mark=top; emitStep(false); return; }
    var gap=Math.min(600,3000/(top-mark));
    var tick=function(){
      finishTimer=null;
      if(mark>=topMark(pages[pos])) return;
      mark++; emitStep(true);
      if(mark<topMark(pages[pos])) finishTimer=setTimeout(tick,gap);
    };
    finishTimer=setTimeout(tick,gap);
  }
  /* 확인 문제가 있는 장은 자동 완주가 멈춘다 — 정답·판정 단계가 스스로 열리면 안 된다.
     판별은 확인 문제 마크업 계약(.chk·.qrow·.ox·.opt·.ans) 또는 장 archetype(check·quiz-*).
     최종 상태 표면(st-self·인쇄 등 staticNow)은 기존 계약대로 전부 펼치고,
     G 키·더블클릭은 사용자가 직접 부르는 finishSteps 라 그대로 둔다(수동 완주). */
  function isQuizSlide(s){
    if(!s) return false;
    var a=(s.dataset&&s.dataset.archetype)||'';
    return a==='check'||a.indexOf('quiz')===0||!!s.querySelector('.chk,.qrow,.ox,.opt,.ans');
  }
  function autoFinish(){
    if(isQuizSlide(pages[pos])&&!staticNow()){
      if(window.edToast) window.edToast('확인 문제 장 — 자동 완주가 멈췄습니다. 단계는 직접 넘겨 주세요');
      return;
    }
    finishSteps();
  }
  /* ---- 모션 재생 방식(M 토글): 장이 바뀔 때 자동 완주 ↔ 입력마다 한 단계 ----
     G 키는 dblclick 과 같은 finishSteps 를 부른다(마우스 없이 남은 단계 순차 재생).
     방식은 localStorage 'edeck-motion-auto' 에 남겨 다음 열람에서도 유지한다.
     자동 완주는 instant 아님(사용자 넘김·첫 로드)에서만 — deckGo·검사기는 영향 없다. */
  var MODE_KEY='edeck-motion-auto';
  var motionAuto=false;
  try{ motionAuto=localStorage.getItem(MODE_KEY)==='1'; }catch(eM){}
  function motionGuard(){
    return !rootEl.classList.contains('ed-compact')&&!document.body.classList.contains('in-hub');
  }
  function motionFinishKey(){ if(motionGuard()) finishSteps(); }
  function motionModeSet(on){
    if(!motionGuard()) return;
    motionAuto=on;
    try{ localStorage.setItem(MODE_KEY,on?'1':'0'); }catch(eM){}
    if(window.edToast) window.edToast(on?'모션 자동 완주 켬 — 장이 바뀌면 그 장의 끝까지 재생합니다 (M 끄기)'
                                        :'모션 자동 완주 끔 — 클릭·키마다 한 단계씩 재생합니다 (M 켜기)');
    if(on) autoFinish(); else cancelFinish();
  }
  document.addEventListener('dblclick',function(e){
    if(rootEl.classList.contains('ed-compact')) return;
    if(document.body.classList.contains('in-hub')) return;
    if(memoBox.contains(e.target)) return;
    /* click 과 같은 가드·같은 영역 — 왼쪽 1/3(이전 영역) 위에서는 동작하지 않는다 */
    if(e.target.closest&&e.target.closest(CLICK_GUARD)) return;
    if(e.clientX<window.innerWidth/3) return;
    finishSteps();
  });
  var drag=null;
  document.addEventListener('touchstart',function(e){ drag=e.touches[0].clientX; },{passive:true});
  document.addEventListener('touchend',function(e){
    if(rootEl.classList.contains('ed-compact')){ drag=null; return; }
    if(drag===null) return;
    var dx=e.changedTouches[0].clientX-drag;
    if(Math.abs(dx)>50){ if(dx<0) advance(); else retreat(); }
    drag=null;
  });

  /* 인쇄할 때는 모든 장을 마지막 단계로 펼치고, 끝나면 현재 화면 상태로 되돌린다 */
  window.addEventListener('beforeprint',function(){ pages.forEach(function(pg){ syncPage(pg,topMark(pg),false); }); });
  window.addEventListener('afterprint',function(){ emitStep(false); });
  /* beforeprint 를 보내지 않는 환경(헤드리스 인쇄 미디어 에뮬레이션 등)도 같은 펼침을 보장한다 */
  var printQ=window.matchMedia?window.matchMedia('print'):null;
  if(printQ&&printQ.addEventListener)printQ.addEventListener('change',function(e){
    if(e.matches)pages.forEach(function(pg){ syncPage(pg,topMark(pg),false); });
    else emitStep(false);
  });
  window.addEventListener('resize',reflow);
  reflow();
  var first=parseInt((location.hash||'').slice(1),10);
  jumpTo(isNaN(first)?0:first-1,false);
  /* 열린 채로 주소 끝 #N 만 바꿔도 그 장으로 간다. jumpTo 의 replaceState 는
     hashchange 를 울리지 않으므로 되돌이가 없다 */
  window.addEventListener('hashchange',function(){
    var n=parseInt((location.hash||'').slice(1),10);
    if(!isNaN(n)&&n-1!==pos) jumpTo(n-1,false);
  });
  setTimeout(function(){ document.getElementById('help').style.opacity='0'; },4000);
  rootEl.classList.add('ed-ready');
}catch(err){ rootEl.classList.add('ed-fail'); throw err; }
})();
</script>

<script>
/* 체크리스트(.todo): 누르면 완료 표시를 켜고 끈다. 이 클릭이 장 넘김으로 번지지 않게 여기서 막는다. */
[].slice.call(document.querySelectorAll('.todo')).forEach(function(box){
  box.addEventListener('click',function(e){ e.stopPropagation(); box.classList.toggle('done'); });
});
</script>
<script>
/*
  도구 층: 자동 발표(A) · 화면 편집(E)
  [자동 발표] A 키로 시작·정지. 현재 장의 남은 단계를 한 단계씩 전부 공개한 뒤
    그 장의 data-sec 초(없으면 6초)만큼 머물고 다음 장으로 간다. 마지막 장이면 끝.
    아무 키 입력으로 정지한다. T·R 타이머와는 독립이고 deckGo 로 움직이므로
    발표자 보기(?presenter) 동기에는 그대로 실린다. 인쇄·reduced-motion 에는 영향 없음.
  [편집] E 키로 켜고 끈다. 제목·문단·표 칸·목록 같은 글자 요소만 contenteditable —
    상호작용 요소(.chk·.todo·버튼·링크·노트·자습·시트 패널)는 제외하고 줄바꿈(Enter)은 막아
    요소를 새로 만들지 못한다(텍스트만). 수정본은 localStorage 'edeck-edit-<파일이름>' 에
    {"<장번호>-<순번>":innerHTML} 로 저장하고, 편집 표시줄의 "수정 초기화" 로 전부 되돌린다.
    인쇄·자습·발표자 보기는 수정된 DOM 을 그대로 읽으므로 자동 반영된다.
    편집을 켜면 자동 발표는 멈춘다(글자 고치는 중 장이 넘어가지 않게).
*/
(function(){
var doc=document,root=doc.documentElement,body=doc.body;
function slides(){return [].slice.call(doc.querySelectorAll('#stage>.slide'));}

/* ---- 자동 발표 ---- */
var autoTimer=null,autoOn=false;
function autoStop(){autoOn=false;if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}root.classList.remove('ed-auto');}
function autoStep(){
  if(!autoOn)return;
  var info=window.deckInfo?deckInfo():null;
  if(!info){autoStop();return;}
  var pg=slides()[info.slide];
  if(info.step<info.maxStep){deckGo(info.slide,info.step+1);autoTimer=setTimeout(autoStep,800);return;}
  var sec=parseFloat(pg&&pg.getAttribute('data-sec'))||6;
  sec=Math.max(2,sec);
  autoTimer=setTimeout(function(){
    if(!autoOn)return;
    var i2=window.deckInfo?deckInfo():null;
    if(i2&&i2.slide<i2.count-1){deckGo(i2.slide+1,0);autoTimer=setTimeout(autoStep,700);}
    else autoStop();
  },sec*1000);
}
function autoStart(){if(autoOn)return;autoOn=true;root.classList.add('ed-auto');autoTimer=setTimeout(autoStep,700);}
window.eduAuto={start:autoStart,stop:autoStop,on:function(){return autoOn;}};

/* ---- 화면 편집 ---- */
var EDIT_SEL='.slide h1,.slide h2,.slide h3,.slide h4,.slide p,.slide li,.slide td,.slide th,.slide figcaption,.slide summary';
var EDIT_EXCL='.chk,.todo,button,a,aside,.st-panel,.st-modal,.st-print,.st-toast,.dsheet-panel,script,style';
var EKEY='edeck-edit-'+(decodeURIComponent(location.pathname.split('/').pop())||'deck');
var editOn=false,orig=new Map(),saveT=null,editBar=null;
function editables(){return [].slice.call(doc.querySelectorAll(EDIT_SEL)).filter(function(el){return !el.closest(EDIT_EXCL);});}
function editSave(){
  var o={};
  orig.forEach(function(html,el){if(el.innerHTML!==html){var k=el.getAttribute('data-ed');if(k)o[k]=el.innerHTML;}});
  try{localStorage.setItem(EKEY,JSON.stringify(o));}catch(e){}
}
function editReset(){
  try{localStorage.removeItem(EKEY);}catch(e){}
  orig.forEach(function(html,el){el.innerHTML=html;});
}
function editToggle(){
  editOn=!editOn;body.classList.toggle('ed-edit',editOn);
  editables().forEach(function(el){if(editOn)el.setAttribute('contenteditable','true');else el.removeAttribute('contenteditable');});
  if(editBar)editBar.hidden=!editOn;
  if(editOn)autoStop();else editSave();
}
doc.addEventListener('input',function(e){
  if(!editOn)return;
  var t=e.target;
  if(!t||!t.getAttribute||!t.getAttribute('data-ed'))return;
  if(saveT)clearTimeout(saveT);saveT=setTimeout(editSave,400);
});
doc.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))){
    if(t.isContentEditable&&e.key==='Enter'&&!e.isComposing)e.preventDefault();
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  var k=e.key;
  if(k==='a'||k==='A'||k==='ㅁ'){if(autoOn)autoStop();else autoStart();}
  else if(k==='e'||k==='E'||k==='ㄷ'){editToggle();}
  else if(autoOn)autoStop();
});
(function init(){
  var tag=doc.createElement('div');tag.id='edAuto';tag.textContent='자동 발표 중 — 아무 키로 정지';body.appendChild(tag);
  var bar=doc.createElement('div');bar.id='edEdit';bar.hidden=true;
  bar.innerHTML='<span>편집 중 — 글자를 바로 고칩니다 (E 종료)</span><button type="button" class="ed-reset">수정 초기화</button>';
  bar.querySelector('.ed-reset').addEventListener('click',function(){editReset();if(window.edToast)edToast('수정을 모두 되돌렸습니다');});
  editBar=bar;body.appendChild(bar);
  var order={};
  editables().forEach(function(el){
    var s=el.closest('.slide'),si=slides().indexOf(s),n=(order[si]=(order[si]||0)+1);
    el.setAttribute('data-ed',si+'-'+n);orig.set(el,el.innerHTML);
  });
  try{var o=JSON.parse(localStorage.getItem(EKEY)||'{}');}catch(e){return;}
  Object.keys(o).forEach(function(k){var el=doc.querySelector('[data-ed="'+k+'"]');if(el)el.innerHTML=o[k];});
})();
})();
</script>
