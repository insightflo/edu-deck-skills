<!doctype html>
<!-- Independent resource-pack shell. Generated by dev/port.py from the same packaged
     sources as shell.html (templates + css/js/fonts) — fix runtime sources and regenerate
     both shells instead of hand-syncing. No legacy visual assets. -->
<html lang="ko" class="ed-deck"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 엔진 준비 표시: ed-js=스크립트 동작, ed-ready=엔진 초기화 완료, ed-fail=실패/3초 초과. */
document.documentElement.classList.add('ed-js');
window.addEventListener('error',function(e){var h=document.documentElement;if(h.classList.contains('ed-ready'))return;if(e&&/ResizeObserver/.test(String(e.message||e)))return;h.classList.add('ed-fail');},true);
setTimeout(function(){var h=document.documentElement;if(!h.classList.contains('ed-ready'))h.classList.add('ed-fail');},3000);
</script>
<title>{{TITLE}}</title><style>/*COMMON_CSS*/</style><style>/*EXTRA_CSS*/</style></head><body>
<noscript><p class="ed-nojs" style="display:block">브라우저에서 열면 넘기기·자습이 동작합니다</p></noscript>
<p class="ed-nojs">브라우저에서 열면 넘기기·자습이 동작합니다</p>
<!--STUDY_DATA-->
<div id="stage"><!--ICONS--><!--SLIDES--></div>
<div id="progress" aria-hidden="true"></div><div id="dots" aria-hidden="true"></div>
<div id="counter" aria-live="polite"></div>
<div id="help">→ 다음 · ← 이전 · F 전체화면 · N 발표자 노트 · S 자습 · P 인쇄 · G 용어집</div>
<div id="notes"><div class="h">발표자 노트 (N으로 닫기)</div><div id="notesText"></div></div>
<script>/*MOTION_JS*/</script>
<script>
/*
  발표 엔진
  [목적] 1920×1080 무대를 창 크기에 맞춰 축소하고, 슬라이드 이동과 슬라이드 안의 단계 등장을 처리한다.
  [입력] #stage 바로 아래 section.slide 들과 그 안의 단계 속성, aside.notes.
    data-step=k  k단계부터 보임(그 단계에서 튀어나오는 효과, AI 말풍선 .a 는 생각 중 점 표시 후 등장)
    data-add=k   k단계부터 보이고 k단계에서만 .new 강조(덧붙인 문구 표시)
    data-only=k  k단계에서만 보임(상태 바꾸기: 전→후, 질문→답)
    data-lit=k   k단계부터 .lit 클래스(정답·1등 막대 강조)
    data-until=k k단계까지만 보임
  [출력] .active/.step-hide/.gone/.new/.lit 클래스 토글, 진행 막대·단계 점·쪽수, 주소 #N, deckslide·deckstep 이벤트.
  [연결] window.deckGo(i, step) 와 window.deckInfo() 는 scripts/check_deck.py 가 렌더 검사에 쓴다.
  [수정시 주의] 속성 이름·클래스 이름을 바꾸면 모든 슬라이드 조각과 검사 스크립트가 함께 깨진다.
*/
(function(){try{
  var stage=document.getElementById('stage');
  var slides=[].slice.call(document.querySelectorAll('#stage > .slide'));
  var counter=document.getElementById('counter');
  var progress=document.getElementById('progress');
  var dots=document.getElementById('dots');
  var notesBox=document.getElementById('notes');
  var notesText=document.getElementById('notesText');
  var cur=0, step=0, notesOn=false;
  var ATTRS=['step','add','only','lit','until'];
  var SEL='[data-step],[data-add],[data-only],[data-lit],[data-until]';
  if(!slides.length) return;

  function maxStep(s){
    var m=0;
    s.querySelectorAll(SEL).forEach(function(e){
      ATTRS.forEach(function(a){ if(e.dataset[a]!==undefined) m=Math.max(m,+e.dataset[a]); });
    });
    return m;
  }
  function reveal(e){
    e.classList.add('pop'); // Shared motion engine observes the semantic step event.
  }
  // 한 슬라이드를 n단계 상태로 그린다. 화면 표시와 인쇄 준비가 함께 쓴다.
  function paint(s,n,animate){
    s.querySelectorAll('[data-step]').forEach(function(e){
      var k=+e.dataset.step; e.classList.toggle('step-hide',k>n);
      if(animate&&k===n) reveal(e);
    });
    s.querySelectorAll('[data-add]').forEach(function(e){
      var k=+e.dataset.add; e.classList.toggle('gone',k>n); e.classList.toggle('new',k===n&&n>0);
    });
    s.querySelectorAll('[data-only]').forEach(function(e){
      var k=+e.dataset.only; e.classList.toggle('gone',k!==n);
      if(animate&&k===n) reveal(e);
    });
    s.querySelectorAll('[data-until]').forEach(function(e){ e.classList.toggle('gone',n>+e.dataset.until); });
    s.querySelectorAll('[data-lit]').forEach(function(e){ e.classList.toggle('lit',+e.dataset.lit<=n); });
  }
  // 단계가 바뀔 때마다 deckstep 을 알린다(채점 크레파스 모션이 단계 공개에 맞춰 그려지게. deckslide 와 같은 형식)
  function apply(animate){
    paint(slides[cur],step,animate);
    var m=maxStep(slides[cur]), h='';
    for(var i=1;i<=m;i++) h+='<i class="'+(i<=step?'on':'')+'"></i>';
    dots.innerHTML=h;
    document.dispatchEvent(new CustomEvent('deckstep',{detail:{slide:cur,step:step}}));
  }
  function fit(){
    var sc=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform='translate(-50%,-50%) scale('+sc+')';
  }
  function show(i,atEnd,immediate){
    stage.dataset.dir=(i>cur)?'fwd':'back';
    cur=Math.max(0,Math.min(slides.length-1,i));
    step=atEnd?maxStep(slides[cur]):0;
    function render(){
    slides.forEach(function(el,k){el.classList.toggle('active',k===cur);});
    apply(false);
    counter.textContent=(cur+1)+' / '+slides.length;
    progress.style.transform='scaleX('+((cur+1)/slides.length)+')';
    var n=slides[cur].querySelector('.notes');
    notesText.textContent=n?n.textContent:'';
    if(location.hash!=='#'+(cur+1)) history.replaceState(null,'','#'+(cur+1));
    document.dispatchEvent(new CustomEvent('deckslide',{detail:cur}));
    }
    if(window.eduMotion&&!immediate&&stage.querySelector('.slide.active')) window.eduMotion.navigate(render,stage.dataset.dir);
    else render();
  }
  function next(){ if(step<maxStep(slides[cur])){step++;apply(true);} else if(cur<slides.length-1){show(cur+1,false);} }
  function prev(){ if(step>0){step--;apply(false);} else if(cur>0){show(cur-1,true);} }
  window.deckGo=function(i,st){
    show(i,false,true); // Preserve synchronous deckGo.
    var m=maxStep(slides[cur]);
    step=(st===undefined)?m:Math.max(0,Math.min(+st,m));
    apply(false);
  };
  window.deckInfo=function(){ return {slide:cur, step:step, maxStep:maxStep(slides[cur]), count:slides.length}; };
  function toggleNotes(){notesOn=!notesOn;notesBox.style.display=notesOn?'block':'none';}
  function fullscreen(){
    var d=document;
    if(!d.fullscreenElement){(d.documentElement.requestFullscreen||function(){}).call(d.documentElement);}
    else{d.exitFullscreen();}
  }
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(t&&(t.isContentEditable||(t.closest&&t.closest('a[href],button,input,textarea,select,summary,.code,.tabs,.faq,.pin-shot,.pin-list')))) return;
    var k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
    else if(k==='Home'){show(0,false);}
    else if(k==='End'){show(slides.length-1,false);}
    else if(k==='f'||k==='F'||k==='ㄹ'){fullscreen();}
    else if(k==='n'||k==='N'||k==='ㅜ'){toggleNotes();}
  });
  document.addEventListener('click',function(e){
    if(document.documentElement.classList.contains('ed-compact')) return;
    if(notesBox.contains(e.target)) return;
    // 참고 자료 링크·체크리스트 칸·확인 문제·자습 창을 누를 때는 슬라이드를 넘기지 않는다
    if(e.target.closest&&e.target.closest('a,button,.todo,.chk,.code,.tabs,.faq,.pin-shot,.pin-list,.st-panel,.st-modal,.st-print')) return;
    if(e.clientX<window.innerWidth/3) prev(); else next();
  });
  var tx=null;
  document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend',function(e){
    if(document.documentElement.classList.contains('ed-compact')){tx=null;return;}
    if(tx===null) return; var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>50){ if(dx<0) next(); else prev(); } tx=null;
  });
  // 인쇄할 때는 모든 슬라이드를 마지막 단계로 펼치고, 끝나면 현재 화면 상태로 되돌린다
  window.addEventListener('beforeprint',function(){ slides.forEach(function(s){ paint(s,maxStep(s),false); }); });
  window.addEventListener('afterprint',function(){ apply(false); });
  window.addEventListener('resize',fit);
  fit();
  var start=parseInt((location.hash||'').slice(1),10);
  show(isNaN(start)?0:start-1,false);
  // 열린 채로 주소 끝 #N 만 바꿔도 그 장으로 간다. show() 의 replaceState 는 hashchange 를 부르지 않아 되돌이가 없다
  window.addEventListener('hashchange',function(){
    var n=parseInt((location.hash||'').slice(1),10);
    if(!isNaN(n)&&n-1!==cur) show(n-1,false);
  });
  setTimeout(function(){document.getElementById('help').style.opacity='0';},4000);
  document.documentElement.classList.add('ed-ready');
}catch(err){document.documentElement.classList.add('ed-fail');throw err;}
})();
</script>
<script>
/*STUDY_JS*/
</script>
<script>
/* 체크리스트(.todo): 누르면 완료 표시가 켜지고 꺼진다. 슬라이드 넘김 클릭으로 번지지 않게 막는다. */
document.querySelectorAll('.todo').forEach(function(el){
  el.addEventListener('click',function(e){ e.stopPropagation(); el.classList.toggle('done'); });
});
</script>
</body></html>
