<section class="slide pack pack-editorial" data-design="editorial" data-archetype="build-up">
  <header class="editorial-masthead"><div class="editorial-brand"><svg class="editorial-emblem" viewBox="0 0 44 44" role="img" aria-label="편집 잡지 엠블럼"><rect x="5" y="9" width="30" height="29" rx="3" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 17h16M12 22h16M12 27h10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M27 4h9v15l-4.5-3.6L27 19z" fill="var(--accent)"/></svg><span class="pack-mark">EDITORIAL</span></div><div class="editorial-issue"><p class="pack-topic">{{TITLE}}</p><span class="editorial-edition">읽고 · 연결하고 · 적용하기</span></div></header>
  <div class="editorial-lead editorial-hero">
    <!-- t2 2톤 문법: 핵심 어절(주로 마지막 어절, 문장당 1회·1~2 어절)을 <em class="t2">…</em>로 감싸면 강조색이 붙는다. flows.json 토큰 값엔 태그를 넣지 않는다(이스케이프됨). 규칙: references/expression.md 1절 -->
    <p class="pack-kicker">{{KICKER}}</p><h1 class="pack-prompt">{{PROMPT}}</h1>
  </div>
  <div class="editorial-spread">
    <article class="editorial-story"><span class="pack-label">본문 / 맥락 읽기</span><p class="pack-body">{{BODY}}</p></article>
    <aside class="editorial-margin"><svg class="editorial-quote" viewBox="0 0 44 32" role="img" aria-label="근거 인용 부호"><path d="M16 4v4c-4 1-7 4-7 8h7v14H4V21C4 13 9 7 16 4Z" fill="currentColor"/><path d="M40 4v4c-4 1-7 4-7 8h7v14H28V21c0-8 5-14 12-17Z" fill="currentColor"/></svg><span class="pack-label">곁에 두는 근거</span><p class="pack-evidence">{{EVIDENCE}}</p></aside>
  </div>
  <footer class="pack-footer editorial-bottom"><span class="pack-label">읽기에서 실천으로</span><p class="pack-action">{{ACTION}}</p><svg class="editorial-arrow-ic" viewBox="0 0 48 48" aria-hidden="true"><path d="M12 36 36 12M18 12h18v18" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg></footer>
  <aside class="notes">{{KICKER}}
질문을 먼저 읽고 잠시 생각할 시간을 주세요. 본문과 곁의 근거를 연결해 설명하세요.
{{BODY}}
확인할 근거: {{EVIDENCE}}
학습 활동: {{ACTION}}</aside>
</section>
