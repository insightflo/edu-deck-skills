<section class="slide pack pack-field" data-design="field" data-archetype="sequence">
  <header class="pack-topline"><span class="pack-mark">FIELD GUIDE / 현장 지침</span><p class="pack-topic">{{TITLE}}</p></header>
  <div class="field-layout">
    <!-- t2 2톤 문법: 핵심 어절(주로 마지막 어절, 문장당 1회·1~2 어절)을 <em class="t2">…</em>로 감싸면 강조색이 붙는다. flows.json 토큰 값엔 태그를 넣지 않는다(이스케이프됨). 규칙: references/expression.md 1절 -->
    <header class="field-sign"><p class="pack-kicker">{{KICKER}}</p><h1 class="pack-prompt">{{PROMPT}}</h1><div class="field-wayfinding" aria-hidden="true"><span></span><b>↓</b></div><p class="field-caption">이해한 뒤<br>현장에서 확인하세요.</p></header>
    <div class="field-protocol">
      <article class="field-row"><span class="field-number">1</span><div><span class="pack-label">먼저 이해하기</span><p class="pack-body">{{BODY}}</p></div></article>
      <aside class="field-row"><span class="field-number">2</span><div><span class="pack-label">근거 대조하기</span><p class="pack-evidence">{{EVIDENCE}}</p></div></aside>
      <div class="field-row field-do"><span class="field-number">3</span><div><span class="pack-label">실행하고 확인하기</span><p class="pack-action">{{ACTION}}</p></div></div>
    </div>
  </div>
  <aside class="notes">{{KICKER}}
설명, 근거 확인, 실행 순서로 안내하세요. 실제 현장의 조건이 예시와 다르면 적용 전에 차이를 확인하게 하세요.
{{BODY}}
확인할 근거: {{EVIDENCE}}
학습 활동: {{ACTION}}</aside>
</section>
