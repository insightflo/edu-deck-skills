<!--
  아키타입 chart-bar (변형: basic / compare)
  언제: 기준·기간·집단 사이의 크기 비교를 막대 높이로 보여 줄 때. 조사로 확인된 값만 쓴다.
  배치 규칙: 본문 장 한 장. 표지에는 쓰지 않는다(첫인상용 큰 숫자는 31 stat-strip).
  근거: 모든 수치에 data-src="F01" 처럼 research.md 사실 id 를 단다 — 막대마다(.chart-bar) 또는
    차트 전체(.chart)에. 누락·없는 id·Fxx 아닌 값은 check_deck ERROR. 참고 자료(28-sources) 장도 필요하다.
  시그니처: metric-rally 재사용 — 등장 시 막대가 아래에서 올라온다(기존 이름만, 신규 창작 아님).
    reduced-motion·인쇄·자습에서는 최종 상태가 그대로 보인다.
  단계: basic 은 막대마다 1단계(data-step). compare 는 단계 없이 한 번에 보여 준다(비교는 나란히).
  쓰는 법: 필요한 section 하나만 복사하고 겹꺾쇠 자리표시를 모두 실제 내용으로 바꾼다.
    막대 좌표(rect y·height)는 실제 값으로 다시 계산한다 — 축 범위 520px 를 최대값 기준으로 환산.
    라이브러리 금지 — 네이티브 SVG 만. 색은 var(--blue)·var(--accent) 같은 의미 색 토큰만.
  자리표시 안의 ≤N자 는 이 배치에서 넘치지 않는 최대 글자 수다(공백 포함). 항목 수를 바꾸면 check_deck.py 로 넘침을 확인한다.
  예산: 축 눈금 라벨 ≤6자 · 항목 라벨 ≤8자 · 값 ≤8자 · 범례 ≤10자.
  배치 설명: references/layouts.md · 클래스: references/classes.md · 규칙: references/expression.md
-->
