<!--
  아키타입 chart-line (변형: basic / compare)
  언제: 시간·순서에 따라 값이 어떻게 변하는지(추세)를 보여 줄 때. 조사로 확인된 값만 쓴다.
  배치 규칙: 본문 장 한 장. 기간 추이는 34, 한 순간의 크기 비교는 33 chart-bar 를 고른다.
  근거: 모든 수치에 data-src="F01" 처럼 research.md 사실 id 를 단다 — 계열마다(.chart-series) 또는
    차트 전체(.chart)에. 누락·없는 id·Fxx 아닌 값은 check_deck ERROR. 참고 자료(28-sources) 장도 필요하다.
  시그니처: grid-wave 재사용 — 등장 시 점·선이 차례로 물결치듯 올라온다(기존 이름만, 신규 창작 아님).
    선 그리기(draw)는 하지 않는다 — 점과 값이 정보라 흐름보다 정지 상태가 먼저 읽혀야 한다.
    reduced-motion·인쇄·자습에서는 최종 상태가 그대로 보인다.
  단계: basic 은 점마다 1단계(data-step). compare 는 단계 없이 한 번에(두 계열은 동시 비교).
  쓰는 법: 필요한 section 하나만 복사하고 겹꺾쇠 자리표시를 모두 실제 내용으로 바꾼다.
    점 좌표(circle cx·cy·polyline points)는 실제 값으로 다시 계산한다 — 축 범위 520px 를 최대값 기준으로 환산.
    라이브러리 금지 — 네이티브 SVG 만. 색은 var(--blue)·var(--accent) 같은 의미 색 토큰만.
  자리표시 안의 ≤N자 는 이 배치에서 넘치지 않는 최대 글자 수다(공백 포함). 항목 수를 바꾸면 check_deck.py 로 넘침을 확인한다.
  예산: 축 눈금 라벨 ≤6자 · 시점 라벨 ≤8자 · 값 ≤8자 · 범례 ≤10자.
  배치 설명: references/layouts.md · 클래스: references/classes.md · 규칙: references/expression.md
-->
