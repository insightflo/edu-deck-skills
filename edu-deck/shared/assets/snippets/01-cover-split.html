<!--
  아키타입 cover (변형: split)
  언제: 표지. 왼쪽 어두운 글 단 + 오른쪽 강조색 면 위 cover-art 자리(주제 상징 그림). 좌우 2분할이 어울리는 주제.
  단계: 단계 없음
  쓰는 법: 필요한 section 하나만 복사해 덱 src/NN-이름.html 로 저장하고 겹꺾쇠 자리표시를 모두 실제 내용으로 바꾼다.
  자리표시 안의 ≤N자 는 이 배치에서 넘치지 않는 최대 글자 수다(공백 포함). 항목 수를 바꾸면 check_deck.py 로 넘침을 확인한다.
  .cover-art = 표지 그림 자리 — «그림: …» 안내를 지우고 주제 상징·아이콘으로 다시 그린다(layouts.md "표지 그림 자리").
  배치 설명: references/layouts.md · 클래스: references/classes.md
-->

</div>
