<!--

  언제: 표지. 오른쪽 2×3 타일 자리(cover-art)에 주제 아이콘·그림을 다시 채우는 모자이크형. 여러 활동·메뉴를 아우르는 주제.

  배치 설명: references/layouts.md · 클래스: references/classes.md
-->
