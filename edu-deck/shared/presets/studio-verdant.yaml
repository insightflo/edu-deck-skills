name: "스튜디오 버던트"
genre: "환경·지속가능성·조직 소개"
intent: "상아색 스튜디오 지면에 식물 잎의 녹음을 옮긴 팔레트입니다. 흰 카드·부드러운 그림자는 계열이 유지하고, 초록 주색과 흙빛 강조가 자연스러운 신뢰를 만드는 차분한 조합입니다."
use: "환경·지속가능성 보고, 조직·제도 소개, 건강·복지 주제처럼 자연 이미지가 어울리는 자료."
avoid: "고채도 에너지가 필요한 론칭·캠페인 자료에는 차분함이 지나칩니다. vivid 계열 팔레트를 고르세요."
