id: vivid-orchid
family: vivid
name: "비비드 오키드"
genre: "전략·비전·기술 쇼케이스"
intent: "남보라 밤 장면 위에 오키드 보라와 주황 점화를 겹친 비비드 계열 팔레트입니다. 글로우 면과 색띠 카드가 미래 지향의 무대 위에서 대비 리듬을 연주하는 과감한 조합입니다."
use: "기술 쇼케이스, 비전·전략 선언, 새로운 방향을 알리는 킥오프 자료."
avoid: "일상 운영 보고나 교육 매뉴얼처럼 반복해 읽는 자료에는 장면 전환이 무겁습니다."
