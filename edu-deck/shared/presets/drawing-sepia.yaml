id: drawing-sepia
family: drawing
name: "드로잉 세피아"
genre: "기술 도면·역사·기록"
intent: "바랜 도면지 위에 세피아 잉크로 그린 도면 계열 팔레트입니다. 헤어라인 상자·격자·치수선이 살고, 주홍 합계선과 청사진 보조선이 오래된 설계 기록의 질감을 냅니다."
use: "기술 사양·설계 리뷰, 연혁·기록물, 도면 언어가 어울리는 엔지니어링 교육."
avoid: "카드형 대시보드나 온기 높은 온보딩 자료에는 선화 문법이 차갑습니다."
