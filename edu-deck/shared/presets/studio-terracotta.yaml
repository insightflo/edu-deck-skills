name: "스튜디오 테라코타"
genre: "워크숍·브랜드 소개·온보딩"
intent: "상아색 지면 위에 구운 흙 색조를 얹은 스튜디오 계열 팔레트입니다. 둥근 흰 카드와 부드러운 그림자 위에서 테라코타 한 색이 따뜻하게 흐르는 정제된 톤으로, 사람과 이야기가 중심인 자료에 어울립니다."
use: "팀 온보딩, 워크숍·사내 문화 소개, 브랜드 스토리처럼 온기를 담아 읽히는 자료."
avoid: "차가운 데이터 대시보드나 규정·감사 문서에는 색 온도가 높습니다. 그런 자리에는 executive-navy·clinical-trust 계열이 맞습니다."
