  ink-2: "#3f4d3b"
  ink-3: "#54614d"
  brand: "#2c5b3f"
  brand-text: "#2c5b3f"
  brand-tint: "#e0ece3"
  accent: "#8a6a2f"
  accent-text: "#82642c"
  accent-tint: "#f2ead8"
  night: "#121a15"
