id: alpine-forest
name: "알파인 포레스트"
genre: "환경·지속가능성"
recommended_theme: forest
intent: "목장의 풀빛을 옅게 깐 지면에 짙은 전나무색 주색을 세웠습니다. 강조는 마른 풀의 황갈색으로 두어 자연 사진과 나란히 놓아도 튀지 않습니다."
use: "지속가능성 보고, 환경 규제 교육, 산업 안전처럼 현장 사진이 함께 붙는 자료."
avoid: "금융 상품이나 정밀 계측처럼 차가운 정확함이 먼저인 주제에는 부드럽게 읽힙니다."
