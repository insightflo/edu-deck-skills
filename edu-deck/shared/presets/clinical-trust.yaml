id: clinical-trust
name: "클리니컬 트러스트"
genre: "의료·임상·규정 준수"
recommended_theme: ocean
intent: "소독된 흰 지면에 청록 주색을 놓아 위생적인 인상을 만들고, 보조 글자는 회청으로 차분히 죽였습니다. 경고와 정상 상태를 색만으로 구분하지 않도록 강조색은 한 곳에만 씁니다."
use: "임상 절차 교육, 의료기기 사용법, 감염 관리·규정 준수 교육처럼 오독이 곧 사고인 자료."
avoid: "브랜드 캠페인이나 창의성 발표에는 지나치게 임상적으로 보입니다."
