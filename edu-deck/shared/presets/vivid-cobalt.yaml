id: vivid-cobalt
family: vivid
name: "비비드 코발트"
genre: "론칭·캠페인·변화 선언"
intent: "밝은 지면과 남색 밤 장면이 교대하는 비비드 계열의 코발트 팔레트입니다. 채도 높은 파랑 주색과 주황 점화가 카드 윗면 색띠·메달·글로우 면 위에서 강한 박자를 만듭니다."
use: "신규 제도 론칭, 캠페인·선언, 에너지가 필요한 전사 발표 자료."
avoid: "조용히 읽는 규정·매뉴얼 문서에는 대비 리듬이 시끄럽습니다. 차분한 스튜디오 계열이 맞습니다."
