id: civic-ochre
name: "시빅 오커"
genre: "공공·정책 안내"
recommended_theme: solar
intent: "관공서 게시물의 황토색 지면에 짙은 청회 주색을 얹어 읽기 쉽게 했습니다. 강조는 황토빛 주황으로 두어 안내 문구와 신청 기한이 눈에 먼저 들어옵니다."
use: "정책 안내, 민원 절차 교육, 지역 공동체 프로그램 소개처럼 많은 사람이 한 번에 읽는 자료."
avoid: "고급 브랜드 이미지를 파는 자료에는 대중적인 인상이 어울리지 않습니다."
tokens:
  paper: "#fbf8f1"
