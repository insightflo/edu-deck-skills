id: drawing-graphite
family: drawing
name: "드로잉 그래파이트"
genre: "제도·검수·매뉴얼"
intent: "흰 제도지 위에 흑연 선만으로 그린 도면 계열 팔레트입니다. 색면을 빼고 선화·격자·콜아웃이 지면을 지배하고, 청사진 보조선과 주홍 정정선만 최소한으로 얹은 절제된 조합입니다."
use: "제도·검수 기준, 정밀 매뉴얼, 장비·공정 도면이 중심인 기술 교육."
avoid: "감성 브랜딩이나 카드형 소개 자료에는 선화만으로는 건조합니다."
